<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dandan Lab Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout (12 Nov 2026, Korbi): the whole screen and no more. A ribbon at the top (views and the map's tools, collapsible), the
   workers' panel (a fifth of the height by default), a divider to move, and the view below it, which scrolls inside itself. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --ink:#15202b; --mute:#5e6b78; --line:#dde3e9; --accent:#1f6fa8;
  --good:#1d8a5b; --on-accent:#ffffff; --bad:#c2412d; --wait:#b7791f; --band:rgba(31,111,168,.16); --grid:#e8edf2;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --panel:#151d26; --ink:#e6edf3; --mute:#8b9aa8; --line:#243140; --accent:#5aa9e0;
  --good:#3fbf86; --bad:#ef6a55; --wait:#e0a84a; --band:rgba(90,169,224,.18); --grid:#1d2834; --on-accent:#0e141b; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e141b; --panel:#151d26; --ink:#e6edf3; --mute:#8b9aa8; --line:#243140; --accent:#5aa9e0;
  --good:#3fbf86; --bad:#ef6a55; --wait:#e0a84a; --band:rgba(90,169,224,.18); --grid:#1d2834; --on-accent:#0e141b; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
#app{height:100vh;height:100dvh;display:grid;grid-template-rows:auto var(--wh,20vh) 7px minmax(0,1fr);grid-template-columns:minmax(0,1fr)}
#app.nopanel{grid-template-rows:auto 0 7px minmax(0,1fr)}
#ribbon{display:flex;align-items:center;gap:6px 14px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
#ribbon .tabs{border:0;gap:2px}
#ribbon .tabs a{padding:5px 10px;border-radius:7px;border-bottom:0;margin:0;font:600 12.5px var(--body)}
#ribbon .tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
.rb-tools{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.rb-tools button,.rb-tools .seg button,.rb-right button{font:500 12px var(--body);padding:4px 9px;border-radius:7px}
.rb-tools .seg{border-radius:8px}.rb-sep{width:1px;height:18px;background:var(--line);margin:0 3px}
.rb-right{margin-left:auto;display:flex;align-items:center;gap:6px}
.rb-right .fresh{font:11.5px var(--mono);color:var(--mute);white-space:nowrap}
.rb-right .tiny{padding:2px 7px;font:600 11px var(--mono);color:var(--mute)}
#app.slim .rb-tools,#app.slim .tabs{display:none}
#workers{overflow:auto;min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(260px,2fr);gap:10px;padding:10px 12px;background:var(--bg)}
#app.nopanel #workers{display:none}
@media (max-width:760px){#workers{grid-template-columns:minmax(0,1fr)}}
#split{cursor:row-resize;background:var(--line);position:relative;touch-action:none}
#split::after{content:"";position:absolute;left:50%;top:2px;width:40px;height:3px;margin-left:-20px;border-radius:2px;background:var(--mute);opacity:.5}
#split:hover,#split:focus-visible{background:var(--accent);outline:0}
#view{min-height:0;overflow:auto;padding:10px 12px;display:grid;align-content:start;gap:14px}
#view.map{overflow:hidden;grid-template-rows:auto minmax(0,1fr);align-content:stretch}
#view.map #canvasView{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;height:100%}
#view.map .cframe{min-height:0;height:100%}
.secs,.cframe,#canvasView{min-width:0}
.secs{grid-template-columns:minmax(0,1fr)}
header{display:grid;gap:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{font:800 26px/1.1 var(--display);font-stretch:85%;letter-spacing:.01em;margin:0;text-wrap:balance}
h1 small{display:block;font:500 12px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin-bottom:4px}
.fresh{font:12.5px var(--mono);color:var(--mute)}
.cframe{position:relative}
#tracker{display:grid;gap:4px;align-content:start;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-width:0}
#tracker .health{display:grid;gap:5px;margin:2px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--line)}
#tracker .hrow{display:grid;grid-template-columns:auto auto 1fr;gap:2px 8px;align-items:baseline;font-size:12px}
#tracker .hrow b{font:700 10.5px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#tracker .hrow>span:last-child{grid-column:1 / -1;color:var(--mute);font-size:11.5px;line-height:1.35}
#tracker .tgrip{font:700 11px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between}
#tracker .tk{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;font-size:12px}
#tracker .tk b{font-weight:600;grid-column:2;line-height:1.3}
#tracker .tk em{grid-column:1 / -1;font-style:normal;font-size:11.5px;color:var(--mute);line-height:1.35;margin-bottom:4px}
#tracker .tk span{font:11.5px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
#tracker .tk .bar{grid-column:1 / -1;height:4px}

.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.controls label{font-size:13px;color:var(--mute)}
input{font:14px var(--mono);padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);width:96px}
button{font:500 13.5px var(--body);padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip{font:12.5px var(--mono);padding:5px 10px;border-radius:999px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(108px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.strip div{background:var(--panel);padding:12px 14px;display:grid;gap:2px}
.strip b{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.strip span{font:600 19px var(--mono);font-variant-numeric:tabular-nums}
.strip em{font-style:normal;font-size:12.5px;color:var(--mute)}
.secs{display:grid;gap:26px}
section{display:grid;gap:10px}
section>h2{font:700 15px var(--display);font-stretch:90%;letter-spacing:.08em;text-transform:uppercase;margin:0;display:flex;gap:10px;align-items:baseline}
section>h2 .count{font:500 12px var(--mono);color:var(--mute);letter-spacing:0}
section>p{margin:-6px 0 0;font-size:13px;color:var(--mute);max-width:70ch}
.cards{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:10px}
.card.running{border-left-color:var(--accent)} .card.good{border-left-color:var(--good)} .card.bad{border-left-color:var(--bad)} .card.wait{border-left-color:var(--wait)}
.card.match{grid-template-columns:1fr}
.card.match>.facts{display:grid;gap:10px;align-content:start}
@media (min-width:760px){.card.match{grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);align-items:start}}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.head h3{font:600 15.5px/1.3 var(--body);margin:0;text-wrap:balance}
.head .id{display:block;font:12px var(--mono);color:var(--mute);margin-top:2px}
.pill{flex:none;font:600 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.running{color:var(--accent)} .pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.wait{color:var(--wait)} .pill.idle{color:var(--mute)}
.bar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:13.5px;margin:0}
.stats dt{color:var(--mute)} .stats dd{margin:0;font-family:var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.big{font:600 30px/1 var(--mono);font-variant-numeric:tabular-nums}
.big small{font-size:15px;color:var(--mute);font-weight:500}
.sub{font-size:12.5px;color:var(--mute)}
.jobs{font:12px/1.6 var(--mono);color:var(--mute)}
.chart svg{width:100%;height:auto;display:block}
svg.rough{width:100%;height:46px;display:block;border-radius:4px}
.mchart svg{width:100%;height:auto;display:block}.mchart .axis{font:13px var(--mono);fill:var(--mute)}
.who{font:600 12px var(--body);fill:var(--ink);opacity:.75}.mchart .who{font-size:14px}
.mchart.empty{font:12px var(--mono);color:var(--mute);padding:10px 0;text-align:center;border:1px dashed var(--grid);border-radius:6px}
#detail.wide{width:min(940px,100%)}
#detail .chart.full .axis{font:12px var(--mono)}
#detail .live{font:12px var(--mono);color:var(--mute);display:flex;gap:6px;align-items:center}
.chart .axis{font:12px var(--mono);fill:var(--mute)}
.err{color:var(--bad);font-size:13.5px;margin:0}
.note{font-size:12.5px;color:var(--mute);margin:0;max-width:75ch}
pre{white-space:pre-wrap;font:12px var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:340px;overflow:auto;margin:0}
details summary{cursor:pointer;font-size:12.5px;color:var(--mute)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs a{font:600 13.5px var(--body);color:var(--mute);text-decoration:none;padding:8px 12px;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hscroll{overflow-x:auto;padding:4px 2px 10px;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(90deg,#000 92%,transparent);-webkit-mask-image:linear-gradient(90deg,#000 92%,transparent)}
.flow{display:grid;grid-template-rows:auto auto;grid-auto-flow:column;column-gap:0;row-gap:12px;align-items:stretch;min-width:max-content;padding-right:56px}
.flow .lane{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;padding:0 8px 0 0;border-right:1px solid var(--line);margin-right:10px}
.flow .lane em{font:400 11px var(--body);letter-spacing:0;text-transform:none;display:block}
.flow .gap{width:34px;display:grid;place-items:center}
.flow .gap svg{width:34px;height:14px;overflow:visible}
.flow .gap.span{grid-row:1 / span 2}
.flow .node{width:212px}
.flow .node.span{grid-row:1 / span 2;width:250px;align-self:center}
.flow .node.span.wide{width:280px}
.flow .blank{width:212px}
.node{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--t);border-radius:10px;padding:11px 12px;display:grid;gap:6px;align-content:start}
.node .type{font:600 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t)}
.node h4{font:600 14px/1.3 var(--body);margin:0;text-wrap:balance}
.node p{margin:0;font-size:12.5px;color:var(--mute)}
.node .row{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.node .jid{font:11.5px var(--mono);color:var(--mute)}
.node .vs{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;font-size:12.5px;margin:0}
.node .vs dt{font:600 11.5px var(--mono);color:var(--t)} .node .vs dd{margin:0}
.t-medium{--t:#23a26d} .t-check{--t:#8a8fa3} .t-set{--t:#7a5af5} .t-judge{--t:#c0399b} .t-engine{--t:var(--accent)} .t-match{--t:#d9822b} .t-out{--t:var(--good)}
.now{display:grid;gap:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.now .item{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.now .item:first-child{border-top:0}
.now .item h4{margin:0;font:600 14px/1.3 var(--body)} .now .item p{margin:0;font-size:12.5px;color:var(--mute);grid-column:2 / -1}
.now .count{font:600 13px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);display:inline-block}
.showgrid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.showgrid .card{grid-template-columns:1fr!important}
.static{font-size:12.5px;color:var(--mute);border:1px dashed var(--line);border-radius:8px;padding:10px;text-align:center}
.pill.running::before,.dot.live{content:""}
.pill.running{display:inline-flex;align-items:center;gap:6px}
.pill.running::before{width:7px;height:7px;border-radius:50%;background:currentColor}
@media (prefers-reduced-motion:no-preference){
  .pill.running::before,.dot.live{animation:blink 1.1s ease-in-out infinite}
  .pill.running{animation:glow 2.2s ease-in-out infinite}
}
.ctools{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.zoom{display:flex;gap:6px}
.zoom button{min-width:38px}
.cwrap{position:relative;height:100%;overflow:auto;border:1px solid var(--line);border-radius:12px;
  background-color:var(--bg);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;touch-action:none;cursor:grab}
.csizer{position:relative}
.canvas{position:absolute;left:0;top:0;transform-origin:0 0}
.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.cnode{position:absolute;box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.06);cursor:default;transition:opacity .2s}
.cnode .grip{cursor:move;touch-action:none;user-select:none}
.cnode.dim{opacity:.22}
.cnode.lit{box-shadow:0 0 0 2px var(--accent),0 6px 18px rgba(0,0,0,.1)}
.port{position:absolute;top:0;bottom:0;width:22px;border:0;background:transparent;padding:0;cursor:pointer;z-index:2}
.port::after{content:"";position:absolute;top:48px;width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--t)}
.port.in{left:-11px} .port.in::after{left:4px}
.port.out{right:-11px} .port.out::after{right:4px}
.port:hover::after,.port:focus-visible::after{background:var(--t)}
.port.more::after{display:none}
.port.more span{position:absolute;top:42px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--t);color:#fff;font:700 12px/24px var(--mono);text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.port.in.more span{right:2px} .port.out.more span{left:2px}
.port.more{width:30px} .port.in.more{left:-26px} .port.out.more{right:-26px}
.menu{position:fixed;z-index:50;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);display:grid;max-height:min(70vh,520px);overflow:hidden}
.mhead{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--line)}
.mlist{overflow:auto;display:grid}
.mlist label{display:grid;grid-template-columns:auto auto 1fr;gap:8px;align-items:start;padding:8px 12px;border-bottom:1px solid var(--grid);font-size:13px;cursor:pointer}
.mlist label:hover{background:var(--bg)}
.mlist input{width:auto;padding:0;margin:3px 0 0}
.mlist i{width:9px;height:9px;border-radius:2px;background:var(--t);margin-top:5px}
.mlist em{display:block;font-style:normal;font-size:11.5px;color:var(--mute)}
.mfoot{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line)}
.mfoot button{font-size:12.5px;padding:5px 10px}
.vert .port{top:auto;bottom:auto;left:0;right:0;width:auto;height:22px}
.vert .port.in{top:-11px;left:0} .vert .port.out{bottom:-11px;right:0}
.vert .port::after{top:4px;left:calc(50% - 6px)!important;right:auto!important}
.vert .port.more{height:30px;width:auto} .vert .port.in.more{top:-26px;left:0} .vert .port.out.more{bottom:-26px;right:0}
.vert .port.more span{top:3px;left:calc(50% - 12px)!important;right:auto!important}
#detail{position:fixed;top:0;right:0;bottom:0;z-index:60;width:min(460px,100%);overflow:auto;background:var(--panel);border-left:3px solid var(--t);box-shadow:-10px 0 30px rgba(0,0,0,.18);padding:16px 18px 30px;display:grid;gap:10px;align-content:start}
#detail .dhead{display:flex;gap:8px;align-items:center}
#detail .dhead .type{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--t);margin-right:auto}
#detail h3{margin:0;font:600 18px/1.3 var(--body);text-wrap:balance}
#detail h4{margin:8px 0 0;font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
#detail p{margin:0;font-size:13.5px;color:var(--mute)}
#detail ul{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13.5px}
#detail ul li{display:flex;gap:8px;align-items:baseline}
#detail ul li i{flex:none;width:9px;height:9px;border-radius:2px;background:var(--t)}
#detail ul.jl li{display:block;font-size:12.5px;color:var(--mute)} #detail ul.jl b{font:500 12px var(--mono);color:var(--ink)}
#detail .x{font-size:22px}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
table.dt th{text-align:right;font:600 11px var(--mono);color:var(--mute);padding:4px 4px;border-bottom:1px solid var(--line)}
table.dt th:first-child,table.dt td:first-child{text-align:left}
table.dt td{text-align:right;padding:6px 4px;border-bottom:1px solid var(--grid);font-family:var(--mono);vertical-align:top}
table.dt td:first-child{font-family:var(--body)}
table.dt td em{display:block;font-style:normal;font-size:11px;color:var(--mute)}
table.dt td.good{color:var(--good);font-weight:600} table.dt td.bad{color:var(--bad)}
table.dt tr.best td{background:color-mix(in srgb,var(--good) 10%,transparent)}
.cnode{cursor:pointer}
.x{border:0;background:transparent;color:var(--mute);font:600 16px/1 var(--body);padding:0 2px;cursor:pointer}
.x:hover{color:var(--bad)}
#chooser{position:fixed;z-index:40;top:44px;left:12px;width:min(760px,calc(100vw - 24px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.2);padding:10px 12px}
#chooser .chead{display:flex;justify-content:space-between;align-items:center;font:700 11px var(--display);letter-spacing:.09em;text-transform:uppercase;color:var(--mute)}
.legend.mini{gap:4px 10px;font-size:11.5px}
.focus{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border:1px solid var(--accent);border-radius:10px;font-size:13.5px}
.items summary{font-size:13px;color:var(--ink);cursor:pointer}
.itemlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:8px;font-size:12.5px}
.itemlist div{display:grid;gap:3px}
.itemlist label{display:flex;gap:6px;align-items:flex-start}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 3px var(--band)}}

.sources{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;align-content:start}

<script>

  "aa-a1-g1b": "G1: model vs Medium", "aa-a1-g2b": "G2: Hard + model vs Hard (Quick)", "aa-a1-pt2": "Model retraining (stage 1)", "aa-a1-g1c": "G1: retrained model vs Medium (guarded)", "aa-a1-g1d": "G1: retrained model vs Medium (unguarded)", "aa-a1-g2c": "G2: Hard + retrained model (guarded)", "aa-a1-g2d": "G2: Hard + retrained model (unguarded)", "aa-a1-g3": "G3: Hard + model vs current Monte (Deep)",
  "aa-a1-vd-plus": "Model alone vs current Monte", "aa-a1-vd-med": "Medium alone vs current Monte", "aa-g8-s3-d": "Value net S3, run d",
  "aa-g0-m": "Medium vs Medium, 30,000 games",
  "aa-g1-base": "Base value net (fresh 64×32)",
  "aa-g1-base2": "Base value net (fresh 64×32), retry",
  "aa-g6-floor": "Luck floor measurement", "aa-g3-s1": "Value net S1", "aa-g3-s2": "Value net S2", "aa-g4-cp": "Checkpoint match set", "aa-g5-gate": "Gate match set",
  "aa-g2-v14": "Stream 1 · Hard at Deep, value net v14",
  "aa-g2-new": "Stream 2 · Hard at Deep, fresh value net",
  "aa-g7-s1": "Round 2 · Hard at Deep + S1", "aa-g7-s2": "Round 2 · Hard at Deep + S2",
};
const KINDS = [
  ["match", "Match sets", "Engine A against engine B, every deal played twice with seats swapped. Accepted once the 99% range of A's score is wholly above 50%. Rejected once it is wholly below 48%: not worth chasing further. Either way the remaining games are stopped."],
  ["selfplay", "Self-play", "Games an engine plays against itself, kept as material to train a value network on."],
  ["training", "Training", "Builds a value network from self-play games."],
  ["check", "Checks", "Measurements with no verdict."],
];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtN = n => Math.round(n).toLocaleString("en-GB");
const hm = t => new Date(t).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
let mcp = null, busy = false, last = null, rawJobs = null, SNAP_MODE = false;
const stamp = at => SNAP_MODE && SNAP ? `Lab as of ${hm(SNAP.at)}` : `Updated ${hm(at)}`;
const matchCache = {}; // finished matches: rows kept, not re-read (also kept in the browser between visits)
let matchCacheLoaded = false;
let reads = 0, readsDone = 0; // connector reads this load, for the "Reading…" line

// ---------- reading the connector's replies ----------
function strings(p, out = [], depth = 0) {
  if (p == null || depth > 8) return out;
  if (typeof p === "string") {
    const t = p.trim();
    if ((t[0] === "{" || t[0] === "[") && t.length < 5e6) { try { const v = JSON.parse(t); out.push(p); strings(v, out, depth + 1); return out; } catch {} }
    out.push(p); return out;
  }
  if (typeof p === "object") for (const v of Object.values(p)) strings(v, out, depth + 1);
  return out;
}
const textOf = r => strings(r).join("\n");
// at most two connector calls in flight (a burst of parallel calls gets refused upstream); a refused or timed-out read is
// tried once more after a short pause: every call here is a read, so repeating one is safe
let inFlight = 0; const waiting = [];
const slot = () => (inFlight < 2 ? (inFlight++, Promise.resolve()) : new Promise(r => waiting.push(r)));
const free = () => { const next = waiting.shift(); if (next) next(); else inFlight--; };
// ---------- off Claude (GitHub Pages): the lab as of the last snapshot ----------
// .github/workflows/fleet.yml copies what this page reads onto the fleet-status branch every 10 minutes (12 Nov 2026, Korbi:
// the connector's per-minute quota left the page behind). Here each gcloud command the page sends is answered from those files.
// Times are moved forward by the snapshot's age, so "running in the last 6 minutes" means at the snapshot.
const SNAP_BASE = "https://raw.githubusercontent.com/KMRRing/Dandan/fleet-status/";
let SNAP = null, SNAP_AT = 0;
// at most six fetches at once (a page that asks for hundreds at once runs the browser out of connections)
let snapIn = 0; const snapWait = [];
const snapGet = async (p, v) => {
  if (snapIn >= 6) await new Promise(r => snapWait.push(r)); else snapIn++;
  try { return await snapGet0(p, v); } finally { const next = snapWait.shift(); if (next) next(); else snapIn--; }
};
const snapGet0 = async (p, v) => { const r = await fetch(SNAP_BASE + p + "?v=" + v); if (!r.ok) throw Object.assign(new Error(p + ": " + r.status), { code: "server_unavailable" }); return r.text(); };
async function snapLoad() {
  if (SNAP && Date.now() - SNAP_AT < 60000) return SNAP;
  const j = JSON.parse(await snapGet("list.json", Date.now()));
  j.names = j.objects.map(o => o[0]); j.times = new Map(j.objects);
  SNAP = j; SNAP_AT = Date.now(); return j;
}
const globRe = g => new RegExp("^" + g.replace(/[.+^${}()|[\]\\]/g, "\\$&").replace(/\*\*|\*|\?/g, m => (m === "**" ? ".*" : m === "*" ? "[^/]*" : "[^/]")) + "$");
const urlsIn = cmd => [...cmd.matchAll(/"?gs:\/\/[^/\s"]+\/([^\s"]*)"?/g)].map(m => m[1]);
const noObjects = () => Object.assign(new Error("One or more URLs matched no objects."), { code: "tool_error" });
async function snapCmd(cmd) {
  const s = await snapLoad(), shift = Date.now() - s.at, iso = t => new Date(t * 1000 + shift).toISOString().slice(0, 19) + "Z";
  const match = g => { const re = globRe(g); return s.names.filter(n => re.test(n)); };
  if (/^gcloud compute instances list/.test(cmd)) return snapGet("gce.txt", s.at);
  if (/^gcloud storage ls -l /.test(cmd)) {
    const names = urlsIn(cmd).flatMap(match); if (!names.length) throw noObjects();
    return names.map(n => `      0  ${iso(s.times.get(n))}  gs://${s.bucket}/${n}`).join("\n") + `\nTOTAL: ${names.length} objects`;
  }
  if (/^gcloud storage ls /.test(cmd)) {
    const dir = urlsIn(cmd)[0], kids = new Set();
    for (const n of s.names) if (n.startsWith(dir)) kids.add(n.slice(dir.length).split("/")[0] + (n.slice(dir.length).includes("/") ? "/" : ""));
    if (!kids.size) throw noObjects();
    return [...kids].map(k => `gs://${s.bucket}/${dir}${k}`).join("\n");
  }
  if (/^gcloud storage objects list /.test(cmd)) {
    const since = Date.parse((cmd.match(/update_time>=([\dT:-]+)/) || [])[1] + "Z") - shift;
    const names = urlsIn(cmd).flatMap(match).filter(n => s.times.get(n) * 1000 >= since); if (!names.length) throw noObjects();
    return names.join("\n");
  }
  if (/^gcloud storage cat /.test(cmd)) {
    const urls = urlsIn(cmd), groups = urls.map(match); if (groups.some(g => !g.length)) throw noObjects();
    // a match's part files come joined in one file
    const one = urls.length === 1 && urls[0].match(/^results\/([^/]+)\/part-\*\.jsonl$/);
    if (one && s.joined?.[one[1]]) return snapGet(`o/results/${one[1]}/parts.jsonl`, s.joined[one[1]]);
    const texts = await Promise.all(groups.flat().map(n => snapGet("o/" + n.split("/").map(encodeURIComponent).join("/"), s.times.get(n)).catch(() => "")));
    return texts.join("\n");
  }
  throw new Error("not in the snapshot: " + cmd);
}
async function gcloud(cmd) {
  if (SNAP_MODE) { reads++; status(); try { const out = await snapCmd(cmd); return { out, raw: out }; } finally { readsDone++; status(); } }
  const call = () => mcp.callTool(SERVER, TOOL, { project: "projects/" + PROJECT, command: cmd + " --project=" + PROJECT }, { cache: false });
  // the connector shares a per-minute request quota with Claude's own checks: a busy minute fails, the next one works,
  // so wait and try again (2, 5, 10, 20 s) rather than give up after one retry
  const busy = e => ["upstream_error", "server_unavailable", "rate_limited"].includes(e?.code) || /quota exceeded|rate limit/i.test(e?.message || "");
  reads++; status();
  await slot();
  try {
    for (let i = 0; ; i++) {
      try {
        // a read that never answers would hold one of the two slots for good, so give up on it after 90 s and try again
        const r = await Promise.race([call(), new Promise((_, no) => setTimeout(() => no(Object.assign(new Error("no answer in 90 s"), { code: "server_unavailable" })), 90000))]), out = textOf(r);
        if (/Quota exceeded for quota metric/i.test(out) && i < 4) throw Object.assign(new Error(out), { code: "rate_limited" });
        return { out, raw: r };
      } catch (e) {
        if (!busy(e) || i >= 4) throw e;
        $("fresh").textContent = "Google Cloud is busy, trying again…";
        await new Promise(res => setTimeout(res, Math.max(e.retryAfterMs || 0, [2000, 5000, 10000, 20000][i] + Math.random() * 1000)));
      }

}
// while nothing has been shown yet, say how far the first load has got instead of a bare "Connecting…"
function status() {
  const f = $("fresh");
  if (!last && busy && f) f.textContent = `Reading the lab bucket… ${readsDone} of ${reads} reads done`;
}
// concatenated JSON objects ("{..}{..}"), braces inside strings such as "{shard}" respected
function* jsonObjects(t) {
  let depth = 0, start = -1, inStr = false, bs = false;
  for (let i = 0; i < t.length; i++) {
    const c = t[i];
    if (inStr) { if (bs) bs = false; else if (c === "\\") bs = true; else if (c === '"') inStr = false; continue; }
    if (c === '"') inStr = true;
    else if (c === "{") { if (!depth++) start = i; }
    else if (c === "}" && depth) { if (!--depth) yield t.slice(start, i + 1); }
  }
}
const parsed = t => [...jsonObjects(t)].map(o => { try { return JSON.parse(o); } catch { return null; } }).filter(Boolean);
const noMatch = e => /matched no objects|No URLs matched|One or more URLs matched no/i.test(JSON.stringify(e?.result ?? "") + " " + (e?.message ?? ""));

// ---------- job facts ----------
// the tracker shows the screen's 18 sets as one line, and the filler batches as one
const trackGroup = id => /^aa-h2-q-/.test(id) ? "aa-h2-q" : /^(spm|spf|sps)\d+$/.test(id) ? id.slice(0, 3) : id === "ab-g2-s4d-1" ? "ab-g2-s4d" : groupOf(id);
const groupOf = id => { const m = id.match(/^(.*?)-\d+-(.+)$/); return m ? m[1] + "-" + m[2] : id; };
const tokens = j => String(j.args).split(/\s+/);
function kindOf(j) {
  if (j.script === "selfplay.mjs") return "selfplay";
  if (/^judge-(variants|train)\.mjs$/.test(j.script)) return "training";
  if (/-match\.mjs$/.test(j.script)) return "match";
  return "check";
}
function gamesPerShard(j) {
  if (j.script !== "selfplay.mjs") return null;
  const total = Number(tokens(j)[4]);
  return total > 0 && j.shards ? total / j.shards : null;
}
function plannedPairs(j) {
  const a = tokens(j);
  if (j.script === "hard-match.mjs") return Number(a[6] ?? 200);
  if (j.script === "medium-match.mjs") return Number(a[4]) || null;
  return null;
}
const DEPTH = { 64: "Quick", 256: "Long", 1024: "Deep", 2048: "Deepest" };
const JUDGE = { "ag-v14.json": "value net v14 (live)", "-": "old built-in value net", "": "old built-in value net" };
function judgeName(t) {
  if (t == null) return "old built-in value net";
  if (JUDGE[t]) return JUDGE[t];
  if (t.startsWith("@")) { const [job, v] = t.slice(1).split("#"); return `value net built by ${job}${v ? ` (variant ${v})` : ""}`; }
  return "value net " + t.replace(/\.json$/, "");
}
function sideName(spec, deals) {
  const [head, j] = spec.split(":"), [search, own] = head.split("*"), d = Number(own || deals);
  const engine = search === "paths" ? "Four-path Hard" : "Hard";
  return { engine: `${engine} at ${DEPTH[d] || d + " deals"}${DEPTH[d] ? ` (${fmtN(d)} deals)` : ""}`, judge: judgeName(j), short: `${engine} ${DEPTH[d] || d}` };
}
function sidesOf(j) {
  if (j.script !== "hard-match.mjs") return null;
  const a = tokens(j), deals = a[5] ?? 64;
  return [sideName(a[3], deals), sideName(a[4], deals)];
}
function matchTitle(j) {
  const s = sidesOf(j);
  if (!s) return null;
  const same = s[0].judge === s[1].judge;
  return `${s[0].short}${same ? "" : " + " + s[0].judge} vs ${s[1].short}${same ? "" : " + " + s[1].judge}${same ? `, both ${s[0].judge}` : ""}`;

  if (!isFinite(ms) || ms <= 0) return null;

// ---------- loading ----------
async function loadMain(pfx, { rows: wantRows = true } = {}) {
  if (!matchCacheLoaded) { matchCacheLoaded = true; Object.assign(matchCache, store("fleet:rows") || {}); }
  // the job list and both listings at once: each is a separate trip through the connector
  const ls = url => gcloud(`gcloud storage ls -l "${url}"`).then(r => r.out, e => { if (noMatch(e)) return ""; throw e; });
  const [jobsTxt, doneTxt, claimTxt] = await Promise.all([
    gcloud(`gcloud storage cat "${B}/jobs/${pfx}*.json"`).then(r => { rawJobs = r.raw; return r.out; }, e => { if (noMatch(e)) return ""; throw e; }),
    ls(`${B}/results/${pfx}*/done-*`), ls(`${B}/claims/${pfx}*/*`)]);
  const jobs = [];
  for (const j of parsed(jobsTxt)) if (j.id && j.shards && j.script && !jobs.some(x => x.id === j.id)) jobs.push(j);
  const done = {}, claims = {}, seen = new Set(), live = {}, doneN = {};
  for (const line of (doneTxt + "\n" + claimTxt).split("\n")) {
    const m = line.match(/(\d{4}-\d\d-\d\dT[\d:]+Z)\s+gs:\/\/[^/]+\/(results|claims)\/([^/\\]+)\/([^\s\\"]+)/);
    if (!m || seen.has(m[2] + m[3] + m[4])) continue;
    seen.add(m[2] + m[3] + m[4]);
    if (m[2] === "results") (done[m[3]] ??= []).push(Date.parse(m[1]));
    else { claims[m[3]] = (claims[m[3]] || 0) + 1; if (Date.now() - Date.parse(m[1]) < 6 * 60000) (live[m[3]] ??= new Set()).add(m[4]); }

  }

  const busyNow = {};
  for (const [id, set] of Object.entries(live)) busyNow[id] = [...set].filter(sh => !doneN[id]?.has(sh)).length;
  // how one-shard jobs ended (so a crash isn't shown as done), and match rows (A's score per deal pair), all at once
  const ended = {}, rows = {}, singles = jobs.filter(j => j.shards === 1 && done[j.id]);
  await Promise.all([
    singles.length ? gcloud("gcloud storage cat " + singles.map(j => `"${B}/results/${j.id}/done-0"`).join(" ")).then(r => {
      const objs = parsed(r.out).filter(o => "code" in o && "by" in o); singles.forEach((j, i) => { if (objs[i]) ended[j.id] = objs[i].code; });
    }, () => {}) : null,
    ...jobs.filter(j => wantRows && kindOf(j) === "match" && done[j.id]).map(j => matchCache[j.id] ? (rows[j.id] = matchCache[j.id]) :
      gcloud(`gcloud storage cat "${B}/results/${j.id}/part-*.jsonl"`).then(r => {
        const got = new Map(); for (const m of r.out.matchAll(/"pair"\s*:\s*(\d+)\s*,\s*"a"\s*:\s*([\d.]+)/g)) got.set(Number(m[1]), Number(m[2]));
        rows[j.id] = [...got].sort((x, y) => x[0] - y[0]).map(x => x[1]);
        if ((done[j.id]?.length || 0) >= j.shards) matchCache[j.id] = rows[j.id];
      }, () => { rows[j.id] = []; })),

  if (pts.length && !pts.some(p => p.n >= nMin)) { lo = 0.2; hi = 0.8; }
  lo = Math.max(0, Math.floor((lo - 0.02) * 20) / 20); hi = Math.min(1, Math.ceil((hi + 0.02) * 20) / 20);
  if (hi - lo < 0.1) { lo = Math.max(0, lo - 0.05); hi = Math.min(1, hi + 0.05); }
  const X = n => L + (n / xMax) * w, Y = v => T + (1 - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo)) * h;
  const ticks = [], step = hi - lo > 0.3 ? 0.1 : 0.05;
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(2));
  const xt = [0, Math.round(xMax / 2), xMax];
  const upper = pts.map(p => `${X(p.n).toFixed(1)},${Y(p.m + p.h).toFixed(1)}`), lower = pts.map(p => `${X(p.n).toFixed(1)},${Y(p.m - p.h).toFixed(1)}`).reverse();
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p.n).toFixed(1)},${Y(p.m).toFixed(1)}`).join("");
  const end = pts.at(-1), col = verdict.cls === "good" ? "var(--good)" : verdict.cls === "bad" ? "var(--bad)" : "var(--accent)";
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="A's score as deal pairs come in, with its 99% range, the 50% accept line and the 48% reject line">
    <rect x="${L}" y="${T}" width="${w}" height="${Y(THRESHOLD) - T}" fill="var(--good)" opacity=".06"/>
    <rect x="${L}" y="${Y(REJECT)}" width="${w}" height="${T + h - Y(REJECT)}" fill="var(--bad)" opacity=".07"/>
    ${ticks.map(v => `<line x1="${L}" x2="${L + w}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--grid)"/><text class="axis" x="${L - 6}" y="${Y(v) + 3.5}" text-anchor="end">${Math.round(v * 100)}%</text>`).join("")}
    ${xt.map((n, i) => `<text class="axis" x="${X(n)}" y="${H - 8}" text-anchor="${i === 0 ? "start" : i === 2 ? "end" : "middle"}">${fmtN(n)}${i === 2 ? " pairs" : ""}</text>`).join("")}
    ${pts.length > 1 ? `<polygon points="${upper.concat(lower).join(" ")}" fill="var(--band)"/>` : ""}
    <line x1="${L}" x2="${L + w}" y1="${Y(THRESHOLD)}" y2="${Y(THRESHOLD)}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="5 4" opacity=".7"/>
    <text class="axis" x="${L + w - 2}" y="${Y(THRESHOLD) - 5}" text-anchor="end">accept above</text>
    <line x1="${L}" x2="${L + w}" y1="${Y(REJECT)}" y2="${Y(REJECT)}" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="2 4" opacity=".9"/>
    <text class="axis" x="${L + w - 2}" y="${Y(REJECT) + 13}" text-anchor="end">reject below 48%</text>
    ${names ? `<text class="who" x="${L + 6}" y="${T + 14}">▲ ${esc(names[0])} winning</text><text class="who" x="${L + 6}" y="${T + h - 6}">▼ ${esc(names[1])} winning</text>` : ""}
    ${pts.length ? `<path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(end.n)}" cy="${Y(end.m)}" r="4" fill="${col}" stroke="var(--panel)" stroke-width="2"/>` : ""}
  </svg>`;
}

// ---------- drawing ----------
function render({ jobs, done, claims, ended, rows, at }) {
  $("fresh").textContent = `${stamp(at)} · next in 2 min`;
  const groups = new Map();
  for (const j of [...jobs].sort((a, b) => a.id.localeCompare(b.id))) {
    const g = groupOf(j.id);
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(j);
  }
  const now = Date.now(), WIN = 30 * 60000, cards = { match: [], selfplay: [], training: [], check: [] };
  let runningAll = 0, spRate = 0; const milestones = [];
  for (const [g, js] of groups) {
    const kind = kindOf(js[0]);
    let shards = 0, nDone = 0, running = 0, recent = 0, first = Infinity, lastT = 0, gps = null, games = 0, gamesTotal = 0, matchRows = [], planned = 0;
    const lines = [];
    for (const j of js) {
      const d = done[j.id] || [], c = claims[j.id] || 0, per = gamesPerShard(j);
      shards += j.shards; nDone += d.length; running += Math.max(0, c - d.length);
      for (const t of d) { if (now - t < WIN) recent++; first = Math.min(first, t); lastT = Math.max(lastT, t); }
      if (per != null) { gps = per; games += d.length * per; gamesTotal += j.shards * per; }
      if (kind === "match") { matchRows = matchRows.concat(rows[j.id] || []); planned += plannedPairs(j) || 0; }
      lines.push(`${j.id}  ${d.length}/${j.shards}${c > d.length ? ` · ${c - d.length} running` : ""}`);
    }
    runningAll += running;
    const complete = nDone >= shards, left = shards - nDone;
    let rate = recent / WIN;
    if (!recent && nDone > 1 && lastT > first && !complete) rate = (nDone - 1) / (lastT - first);
    const failed = js.length === 1 && ended[js[0].id] != null && ended[js[0].id] !== 0;
    const name = NAMES[g] || (kind === "match" && matchTitle(js[0])) || (js[0].purpose ? js[0].purpose.split(/[:(]/)[0].slice(0, 80) : g);
    const finish = !complete && rate > 0 ? whenIn(left / rate) : null;
    let st = failed ? { cls: "bad", label: `Failed · ${ended[js[0].id]}` } : complete ? { cls: "good", label: "Done" } : running ? { cls: "running", label: `${running} running` } : nDone ? { cls: "wait", label: "Waiting" } : { cls: "idle", label: "Queued" };
    const idLine = js.length > 1 ? `${esc(g)} · ${js.length} batches` : esc(js[0].id);
    let html;

    if (kind === "match") {
      const pts = series(matchRows), end = pts.at(-1), v = verdictOf(end, complete);
      if (!failed) st = v.cls === "running" && !running ? { cls: nDone ? "wait" : "idle", label: nDone ? "Waiting" : "Queued" } : v;
      const sides = sidesOf(js[0]);
      html = `<div class="card match ${st.cls}"><div class="facts">
        <div class="head"><h3>${esc(name)}<span class="id">${idLine}</span></h3><span class="pill ${st.cls}">${esc(st.label)}</span></div>
        ${end ? `<div class="big">${(end.m * 100).toFixed(1)}<small>% ± ${(end.h * 100).toFixed(1)}</small></div>
        <div class="sub">A's score over ${fmtN(end.n)} deal pairs (${fmtN(end.n * 2)} games), 99% range</div>` : `<div class="sub">No games in yet.</div>`}
        ${js[0].purpose ? `<div class="sub">${esc(js[0].purpose)}</div>` : ""}
        <dl class="stats">
          ${sides ? `<dt>A</dt><dd>${esc(sides[0].engine)} + ${esc(sides[0].judge)}</dd><dt>B</dt><dd>${esc(sides[1].engine)} + ${esc(sides[1].judge)}</dd>` : ""}
          <dt>Range</dt><dd>${end ? `${((end.m - end.h) * 100).toFixed(1)} – ${((end.m + end.h) * 100).toFixed(1)}%` : "—"}</dd>
          <dt>Shards</dt><dd>${fmtN(nDone)} of ${fmtN(shards)}${running ? ` · ${running} running` : ""}</dd>
          ${finish ? `<dt>All in</dt><dd>~${finish.at} (${finish.span})</dd>` : ""}
        </dl></div>
        <div class="chart">${chartSvg(pts, planned, v)}</div></div>`;
      if (finish) milestones.push({ t: left / rate, what: name + ": all in" });
    } else {
      const pct = shards ? nDone / shards : 0;
      let extra = "";
      if (!complete && rate > 0) {
        const per = rate * 3600000 * (gps ?? 1);
        if (kind === "selfplay") spRate += per;
        extra += `<dt>Rate</dt><dd>${fmtN(per)} ${gps != null ? "games" : "shards"} an hour</dd>`;
        if (gps != null && /^aa-g2-/.test(g) && games < CHECKPOINT && CHECKPOINT < gamesTotal) {
          const c = whenIn((CHECKPOINT - games) / gps / rate);
          if (c) { extra += `<dt>Checkpoint</dt><dd>${CHECKPOINT} games ~${c.at} (${c.span})</dd>`; milestones.push({ t: (CHECKPOINT - games) / gps / rate, what: name + ": checkpoint" }); }
        }
        if (finish) { extra += `<dt>All in</dt><dd>~${finish.at} (${finish.span})</dd>`; milestones.push({ t: left / rate, what: name + ": all in" }); }
      } else if (complete && lastT) extra += `<dt>Finished</dt><dd>${hm(lastT)}</dd>`;
      const one = js.length === 1 && js[0].shards === 1;
      html = `<div class="card ${st.cls}">
        <div class="head"><h3>${esc(name)}<span class="id">${idLine}</span></h3><span class="pill ${st.cls}">${esc(st.label)}</span></div>
        <div class="bar"><i style="width:${(pct * 100).toFixed(1)}%"></i></div>
        <dl class="stats">
          ${gps != null ? `<dt>Games</dt><dd>${fmtN(games)} of ${fmtN(gamesTotal)}</dd>` : ""}
          <dt>Shards</dt><dd>${fmtN(nDone)} of ${fmtN(shards)}</dd>${extra}
        </dl>
        ${js.length > 1 ? `<details><summary>Batches</summary><div class="jobs">${lines.map(esc).join("<br>")}</div></details>` : ""}
        ${one && complete ? `<div><button data-out="${esc(js[0].id)}">Show output</button></div><div id="out-${esc(js[0].id)}"></div>` : ""}
      </div>`;
    }
    cards[kind].push(html);
  }

  const next = milestones.sort((a, b) => a.t - b.t)[0], nx = next && whenIn(next.t);
  $("strip").innerHTML = `
    <div><b>Running now</b><span>${fmtN(runningAll)}</span><em>shards on workers</em></div>
    <div><b>Self-play</b><span>${spRate ? fmtN(spRate) : "—"}</span><em>games an hour</em></div>
    <div><b>Next milestone</b><span>${nx ? "~" + nx.at : "—"}</span><em>${nx ? esc(next.what) + " · in " + nx.span : "nothing scheduled"}</em></div>`;

  let out = "";
  for (const [k, title, blurb] of KINDS) {
    if (!cards[k].length) continue;

  }

  $("sections").innerHTML = `<div class="secs">${out}</div>`;
}

document.addEventListener("touchend", e => { if (pan1 && !e.touches.length) { SCROLL = { l: pan1.w.scrollLeft, t: pan1.w.scrollTop }; pan1 = null; } if (pinch && e.touches.length < 2) { pinch = null; store("fleet:zoom", +ZOOM.toFixed(3)); SCROLL = { l: $("cwrap").scrollLeft, t: $("cwrap").scrollTop }; } });
function rerender() { if (last) renderCanvas(last); }
document.addEventListener("click", ev => {
  const go = ev.target.closest?.("[data-goto]");
  if (go && GRAPH) {
    const ids = go.dataset.goto.split(" "), n = GRAPH.nodes.find(n => (n.jobs || []).some(j => ids.includes(j.id)));
    if (n) goToBox(n.key);
    return;
  }
  const port = ev.target.closest?.("[data-port]");
  if (port) { const key = port.closest(".cnode").dataset.key, dir = port.dataset.port; MENU = MENU && MENU.key === key && MENU.dir === dir ? null : { key, dir }; drawMenu(); return; }
  const mi = ev.target.closest?.("[data-mi]");
  if (mi && MENU) {
    const act = mi.dataset.mi, near = neighbours(MENU.key, MENU.dir);
    if (act === "all") reveal(MENU.key, near.filter(k => !SHOWN.has(k)));
    else if (act === "none") near.forEach(k => SHOWN.delete(k));
    else if (act === "trace") { FOCUS = FOCUS && FOCUS.key === MENU.key && FOCUS.dir === MENU.dir ? null : { key: MENU.key, dir: MENU.dir }; MENU = null; }
    saveMap(); rerender(); return;
  }
  if (MENU && !ev.target.closest?.(".menu")) { MENU = null; drawMenu(); }
  if (ev.target.closest?.("#detail [data-close]")) { DETAIL = null; drawDetail(); return; }
  const box = ev.target.closest?.(".cnode");
  if (box && !ev.target.closest("button,input,a") && Date.now() - justDragged > 300) { DETAIL = box.dataset.key; MENU = null; drawMenu(); drawDetail(); pollLive(); return; }
  const hide = ev.target.dataset?.hide;
  if (hide) { SHOWN.delete(hide); if (FOCUS?.key === hide) FOCUS = null; saveMap(); rerender(); return; }
  if (ev.target.id === "orient") { saveMap(); ORIENT = ORIENT === "lr" ? "down" : "lr"; store("fleet:orient2", ORIENT); MANUAL = store(mk("manual:" + ORIENT)) || {}; MENU = null; SCROLL = { l: 0, t: 0 }; rerender(); return; }
  if (ev.target.id === "chooseBtn") { $("chooser").hidden = !$("chooser").hidden; ev.target.setAttribute("aria-expanded", String(!$("chooser").hidden)); return; }
  if (ev.target.id === "chooseClose") { $("chooser").hidden = true; $("chooseBtn")?.setAttribute("aria-expanded", "false"); return; }
  if (ev.target.id === "tidy") { tidy(); saveMap(); rerender(); return; }
  const scope = ev.target.closest?.("[data-scope]")?.dataset.scope;
  if (scope && GRAPH && last) {
    SCOPE = scope; FOCUS = null; MENU = null;
    SHOWN = scope === "all" ? new Set(GRAPH.nodes.map(n => n.key)) : relevantKeys(GRAPH, last);
    store(mk("relseen"), GRAPH.nodes.map(n => n.key).filter(k => scope === "all" || SHOWN.has(k)));
    saveMap(); SCROLL = { l: 0, t: 0 }; rerender(); return;
  }
  if (ev.target.id === "clearFocus") { FOCUS = null; rerender(); return; }
  const z = ev.target.dataset?.zoom;
  if (z != null) {
    if (z === "0") { const w = $("cwrap"), c = $("canvas"); ZOOM = Math.max(0.3, Math.min(1, w.clientWidth / c.offsetWidth)); }
    else ZOOM = Math.max(0.3, Math.min(1.5, +(ZOOM + Number(z) * 0.15).toFixed(2)));
    store("fleet:zoom", ZOOM); rerender();
  }
});
document.addEventListener("change", ev => {
  const mk = ev.target.dataset?.mk;
  if (mk && MENU) { if (ev.target.checked) reveal(MENU.key, [mk]); else SHOWN.delete(mk); saveMap(); rerender(); return; }
  const idea = ev.target.dataset?.idea;
  if (idea && GRAPH) { for (const n of GRAPH.nodes) if (ideaOf(n) === idea) { if (ev.target.checked) SHOWN.add(n.key); else SHOWN.delete(n.key); } saveMap(); rerender(); return; }
  const k = ev.target.dataset?.item; if (!k) return;
  if (ev.target.checked) SHOWN.add(k); else SHOWN.delete(k);
  saveMap(); rerender();
});

// ---------- now and the show matches ----------
function describe(j) {
  const a = tokens(j);
  if (j.script === "selfplay.mjs") {
    const deals = Number(a[3]), mode = a[6] || "hard";
    if (mode.startsWith("medium")) return "Self-play: Medium vs Medium";
    return `Self-play: ${mode === "paths" ? "Four-path Hard" : "Hard"} at ${DEPTH[deals] || deals + " deals"} + ${shortJudge(judgeKeyOf(a[7]))}`;
  }
  if (/-match\.mjs$/.test(j.script)) return "Match: " + (matchTitle(j) || j.script.replace(".mjs", ""));
  if (/^judge-/.test(j.script)) return "Training a value network";
  return "Check: " + j.script.replace(".mjs", "");
}
function renderNow(d) {
  $("nowView").innerHTML = `<section><h2>Working on now<span class="count">${nowList.length}</span></h2><p>Everything the workers are running this minute.</p>${
    nowList.length ? `<div class="now">${nowList.map(x => `<div class="item"><span class="dot live"></span><h4>${esc(x.title)}</h4><span class="count">${x.running} of ${x.shards} live</span><p>${esc(x.id)}${x.filler ? " · filler: runs whenever the queue is empty" : ""}</p></div>`).join("")}</div>`
    : `<div class="now"><div class="item"><span class="dot" style="background:var(--mute)"></span><h4>Nothing running</h4></div></div>`}</section>`;
}
function renderMatches() {
  const byId = { ...SPECS };
  $("matchesView").innerHTML = `<section><h2>Show match sets<span class="count">${SHOW.length}</span></h2><p>Finished matches that explain today's choices. A is the challenger; its score is the share of points it took, draws as half.</p><div class="showgrid">${SHOW.map(x => {
    if (x.local) return `<div class="card idle"><div class="head"><h3>${esc(x.title)}</h3><span class="pill good">Done</span></div><dl class="stats"><dt>A</dt><dd>${esc(x.a)}</dd><dt>B</dt><dd>${esc(x.b)}</dd></dl><div class="static">${esc(x.local)}</div></div>`;
    const rows = x.jobs.flatMap(id => showRows[id] || []), pts = series(rows), end = pts.at(-1), v = verdictOf(end, true);
    const n = GRAPH?.nodes.find(k => k.key === "match:" + x.jobs.join("+"));
    return `<div class="card ${v.cls}"><div class="head"><h3>${esc(x.title)}<span class="id">${esc(x.jobs.join(" + "))}</span></h3><span class="pill ${v.cls}">${esc(v.label)}</span></div>
      ${end ? `<div class="big">${(end.m * 100).toFixed(1)}<small>% ± ${(end.h * 100).toFixed(1)}</small></div><div class="sub">A's score over ${fmtN(end.n)} deal pairs, 99% range</div>` : `<div class="sub">Loading games…</div>`}
      ${n ? `<dl class="stats"><dt>A</dt><dd>${esc(n.a)}</dd><dt>B</dt><dd>${esc(n.b)}</dd></dl>` : ""}
      <div class="chart">${chartSvg(pts, x.planned, v)}</div><p class="note">${esc(x.note)}</p></div>`;
  }).join("")}</div></section>
  <p class="note">Deal pair: one random deal played twice with seats swapped, so neither side keeps the luckier hand. Quick, Long, Deep, Deepest: Hard considers 64, 256, 1,024 or 2,048 possible hidden-card deals per move; the live game plays Deepest.</p>`;
}
// what's running this minute: claims re-stamped in the last 5 minutes (workers re-stamp every 2)
async function loadNow() {
  const since = new Date(Date.now() - 5 * 60000).toISOString().slice(0, 19);
  const dirs = (await gcloud(`gcloud storage ls "${B}/claims/"`)).out;
  const latest = p => { const ns = [...dirs.matchAll(new RegExp(`/claims/${p}(\\d+)/`, "g"))].map(m => Number(m[1])); return ns.length ? Math.max(...ns) : null; };
  const spb = latest("spb"), jt = latest("jt");
  const urls = [`"${B}/claims/a**"`];
  if (spb != null) urls.push(`"${B}/claims/spb${spb}/*"`, `"${B}/claims/spb${spb - 1}/*"`);
  if (jt != null) urls.push(`"${B}/claims/jt${jt}/*"`);
  let names = "";
  try { names = (await gcloud(`gcloud storage objects list ${urls.join(" ")} --filter="update_time>=${since}" --format="value(name)"`)).out; } catch (e) { if (!noMatch(e)) throw e; }
  const count = {}, seen = new Set();
  for (const m of names.matchAll(/claims\/([^/\s\\"]+)\/(\d+)/g)) { const k = m[1] + "/" + m[2]; if (!seen.has(k)) { seen.add(k); count[m[1]] = (count[m[1]] || 0) + 1; } }
  const ids = Object.keys(count);
  let specs = [];
  if (ids.length) specs = parsed((await gcloud("gcloud storage cat " + ids.map(id => `"${B}/jobs/${id}.json"`).join(" "))).out).filter(j => j.id && j.script);
  nowList = ids.map(id => {
    const j = specs.find(x => x.id === id) || { id, script: "?", args: "", shards: "?" };
    return { id, title: NAMES[groupOf(id)] || describe(j), running: count[id], shards: j.shards, filler: /^(spb|jt)\d+$/.test(id) };
  }).sort((a, b) => b.running - a.running);
}
let FETCHING = false;
async function loadRows(ids) {
  for (const id of ids) {
    try {
      const out = (await gcloud(`gcloud storage cat "${B}/results/${id}/part-*.jsonl"`)).out, got = new Map();
      for (const m of out.matchAll(/"pair"\s*:\s*(\d+)\s*,\s*"a"\s*:\s*([\d.]+)/g)) got.set(Number(m[1]), Number(m[2]));
      showRows[id] = [...got].sort((x, y) => x[0] - y[0]).map(x => x[1]);
    } catch { showRows[id] = []; }
  }
  try { localStorage.setItem("fleet:showRows", JSON.stringify(showRows)); } catch {}
}
async function loadShow() {
  for (const id of SHOW_IDS) {
    if (showRows[id]?.length) continue;
    try {
      const out = (await gcloud(`gcloud storage cat "${B}/results/${id}/part-*.jsonl"`)).out, got = new Map();
      for (const m of out.matchAll(/"pair"\s*:\s*(\d+)\s*,\s*"a"\s*:\s*([\d.]+)/g)) got.set(Number(m[1]), Number(m[2]));
      showRows[id] = [...got].sort((x, y) => x[0] - y[0]).map(x => x[1]);
    } catch {}
  }
  try { localStorage.setItem("fleet:showRows", JSON.stringify(showRows)); } catch {}
}
function showView() {
  const v = view();
  for (const x of VIEWS) $("tab-" + x).setAttribute("aria-current", v === x ? "page" : "false");
  $("canvasView").hidden = v !== "pipeline" && v !== "fable"; $("nowView").hidden = v !== "now"; $("matchesView").hidden = v !== "matches";
  $("sections").hidden = v !== "jobs"; $("jobsTop").hidden = v !== "jobs";
  const map = v === "pipeline" || v === "fable";
  $("view").classList.toggle("map", map); $("mapTools").hidden = !map; if (!map) $("chooser").hidden = true;
}
window.addEventListener("hashchange", () => { showView(); refresh(); });
// the divider between the workers' panel and the view: dragged, or moved with the arrow keys; its place is kept
{
  const app = $("app"), setH = px => { const h = Math.max(70, Math.min(innerHeight * 0.7, px)); app.style.setProperty("--wh", h + "px"); return h; };
  const saved = store("fleet:panelH"); if (saved) setH(saved);
  if (store("fleet:panelOff")) { app.classList.add("nopanel"); $("panelToggle").setAttribute("aria-pressed", "false"); }
  if (store("fleet:slim")) { app.classList.add("slim"); $("ribbonToggle").textContent = "▾"; }
  let drag = null;
  $("split").addEventListener("pointerdown", e => { drag = { y: e.clientY, h: $("workers").offsetHeight }; $("split").setPointerCapture(e.pointerId); e.preventDefault(); });
  $("split").addEventListener("pointermove", e => { if (drag) setH(drag.h + e.clientY - drag.y); });
  $("split").addEventListener("pointerup", () => { if (drag) { store("fleet:panelH", $("workers").offsetHeight); drag = null; } });
  $("split").addEventListener("keydown", e => { const k = { ArrowUp: -24, ArrowDown: 24 }[e.key]; if (k) { e.preventDefault(); store("fleet:panelH", setH($("workers").offsetHeight + k)); } });
  $("panelToggle").addEventListener("click", () => { const off = app.classList.toggle("nopanel"); $("panelToggle").setAttribute("aria-pressed", String(!off)); store("fleet:panelOff", off ? 1 : 0); });
  $("ribbonToggle").addEventListener("click", () => { const slim = app.classList.toggle("slim"); $("ribbonToggle").textContent = slim ? "▾" : "▴"; store("fleet:slim", slim ? 1 : 0); });
}
showView();

document.addEventListener("click", async ev => {
  const chip = ev.target.closest?.("[data-pfx]");
  if (chip) { $("pfx").value = chip.dataset.pfx; refresh(); return; }
  const id = ev.target?.dataset?.out; if (!id || !mcp) return;
  const box = $("out-" + id); box.innerHTML = '<p class="note">Loading…</p>';
  try {
    const { raw } = await gcloud(`gcloud storage cat "${B}/results/${id}/stdout-0.txt"`);
    const txt = strings(raw).filter(s => !/^\s*\{\s*"response"/.test(s)).join("\n").trim();
    box.innerHTML = `<pre>${esc(txt.slice(-6000) || "(no output)")}</pre>`;
  } catch (e) { box.innerHTML = `<p class="err">${esc(e?.message || e?.code || e)}</p>`; }
});
$("go").addEventListener("click", refresh);
$("pfx").addEventListener("keydown", e => { if (e.key === "Enter") refresh(); });

(async () => {
  if (!window.claude?.use) { SNAP_MODE = true; mcp = {}; refresh(); setInterval(() => { if (!document.hidden) refresh(); }, 120000); return; }
  mcp = await window.claude.use("mcp");
  if (!mcp) { $("msg").innerHTML = '<p class="err">This view can\'t reach your connectors. Open the page in the Claude app or on claude.ai.</p>'; return; }
  refresh();
  setInterval(() => { if (!document.hidden) refresh(); }, 120000);
})();
