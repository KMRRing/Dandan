# A value net from a lab job into judges/ with its redraw table (13 Nov 2026): lab/judge-from-job.mjs, then lab/keep-table.mjs
# (the keep by the value net reads judges/<name>.json's `mull`). Read-only on the bucket; the file is committed to main.
name: Judge file from a lab job
on:
  workflow_dispatch:
    inputs:
      job: { description: "judge-variants job", required: true }
      variant: { description: "Variant (or -: the first line)", required: true, default: "-" }
      name: { description: "File name (judges/<name>.json)", required: true }
      note: { description: "A line on what it is", required: false, default: "" }
      hands: { description: "Keep table: sample hands", required: true, default: "1500" }
      deals: { description: "Keep table: deals of the other hand", required: true, default: "32" }
permissions:
  contents: write
jobs:
  judge:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The net
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_BUCKET: dandan-lab-807207481983
        run: |
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          LAB_KEY="$RUNNER_TEMP/key.json" node lab/judge-from-job.mjs "${{ inputs.job }}" "${{ inputs.variant }}" "${{ inputs.name }}" "${{ inputs.note }}" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/key.json"
      - name: Its redraw table
        run: node lab/keep-table.mjs "${{ inputs.name }}.json" "${{ inputs.hands }}" "${{ inputs.deals }}" 1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "judges/${{ inputs.name }}.json"
          git commit -q -m "Judge file ${{ inputs.name }} from ${{ inputs.job }} with its redraw table" || exit 0
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
