# The nets' scorecard (18 Nov 2026, Korbi: "metrics for each of the nets to test their performance, tests or numbers; how good is
# the belief tracking opponent cards, especially land count and counter count"). Every net on the same held-out games (every
# fifth seed of the batches given, never trained on by any net), so the numbers line up across generations:
#   dealer (Scry G): nats a hidden card, the edge over the pool's odds, and the opponent's hidden lands and answers (Memory Lapse,
#                    Commit // Memory, Narset's Reversal) counted: mean abs error, bias, chance of the exact count
#   policy:          agreement with the search's move (all and by kind), the soft loss on the search's spread, the points given up
#   value:           log loss and Brier on the game's result (the search's value left out), a coin 0.693
# Read-only: the bucket with the fleet-reader key, the numbers in the run's summary.
name: Nets' scorecard
on:
  workflow_dispatch:
    inputs:
      nets: { description: "Nets to score, comma-separated (lab/zero/nets/<name>-gpolicy, -gvalue, -scryg)", required: true, default: "gm2,zl15,zl16,zl17" }
      games: { description: "Zero game jobs whose held-out games are the test", required: true, default: "zps018" }
permissions:
  contents: read
jobs:
  belief:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dealers
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_BUCKET: dandan-lab-807207481983
        run: |
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          specs="pool"; for n in $(echo "${{ inputs.nets }}" | tr , ' '); do [ -f "lab/zero/nets/$n-scryg.json" ] && specs="$specs sg:$n"; done
          for k in 0 1 2 3; do LAB_KEY="$RUNNER_TEMP/key.json" node lab/zero/belief-eval.mjs "${{ inputs.games }}" $k 4 $specs > "$RUNNER_TEMP/b$k.json" & done; wait
          rm -f "$RUNNER_TEMP/key.json"
          node lab/zero/belief-eval.mjs --sum "$RUNNER_TEMP"/b?.json | tee "$RUNNER_TEMP/belief.txt"
          { echo '### Dealers (Scry G)'; echo '```'; cat "$RUNNER_TEMP/belief.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
  list:
    runs-on: ubuntu-latest
    outputs: { nets: "${{ steps.l.outputs.nets }}" }
    steps:
      - id: l
        run: echo "nets=$(echo '${{ inputs.nets }}' | tr -cd 'A-Za-z0-9_,-' | jq -Rc 'split(",")')" >> "$GITHUB_OUTPUT"
  nets:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: { net: "${{ fromJSON(needs.list.outputs.nets) }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pack the held-out games with this net's dealer, and score
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_BUCKET: dandan-lab-807207481983
        run: |
          pip install -q numpy
          N="${{ matrix.net }}"; D="$RUNNER_TEMP/p"; S="lab/zero/nets/$N-scryg.json"
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          # VBLEND=0: the value rows' target is the game's result alone
          # a net from before view version 3 (2,602 inputs): its block marks and belief as it was trained
          V3=$(node -e 'import("./dandan-general.js").then(m => console.log(m.viewSize(m.POOL, 3)))')
          LEG=$(python3 -c "import json; print(1 if json.load(open('lab/zero/nets/$N-gpolicy.json'))['net']['XN'] < $V3 else 0)")
          for k in 0 1 2 3; do LEGACY=$LEG HOLD_ONLY=1 ENC=general VBLEND=0 HANDS=256 DEALT=16 VNET="lab/zero/nets/$N-gvalue.json" LAB_KEY="$RUNNER_TEMP/key.json" node lab/zero/replay-pack2.mjs "$D/$k" "${{ inputs.games }}" "$S" $k 4 > "$RUNNER_TEMP/t$k.txt" & done; wait
          rm -f "$RUNNER_TEMP/key.json"
          tail -n 1 "$RUNNER_TEMP"/t?.txt
          python3 lab/zero/pack-merge.py "$RUNNER_TEMP/m" "$D"/[0-9]
          set -o pipefail
          # the nets' own sizes (18 Nov 2026: the size test's 4x and 10x nets)
          read H1 H2 H3 < <(python3 -c "import json; n=json.load(open('lab/zero/nets/$N-gpolicy.json'))['net']; print(n['H1'], n['H2'], n.get('H3', 64))")
          VS=$(python3 -c "import json; L=json.load(open('lab/zero/nets/$N-gvalue.json'))['layers']; print('x'.join(str(l['n'][1]) for l in L[:-1]))")
          python3 lab/policy_np.py "$RUNNER_TEMP/m/a" /tmp/p.json --form head2 --h1 $H1 --h2 $H2 --h3 $H3 --soft 0.02 --epochs 0 --init "lab/zero/nets/$N-gpolicy.json" | tee "$RUNNER_TEMP/pol.txt"
          python3 lab/zero/value_np.py "$RUNNER_TEMP/m/v" /tmp/v.json --shape "$VS" --epochs 0 --init "lab/zero/nets/$N-gvalue.json" | tee "$RUNNER_TEMP/val.txt"
          python3 lab/zero/scorecard-line.py "$N" "$RUNNER_TEMP/pol.txt" "$RUNNER_TEMP/val.txt" | tee -a "$GITHUB_STEP_SUMMARY"
          # the value net on true hands and on 16 worlds dealt from the seat's belief, as the search uses it (19 Nov 2026, Fable)
          { echo; echo "$N:"; python3 lab/zero/value-dealt.py "$RUNNER_TEMP/m/v"; } | tee -a "$GITHUB_STEP_SUMMARY"
