# The finished games, collected from the database onto the `game-records` branch so they can be read with git (the games are
# in Firebase, which a session can't reach, and the page can't list them: the database's rules only open a room to those who
# know its code). tools/pull-games.mjs reads the index room as any visitor to the page does (an anonymous sign-in with the page's
# own public key), so no secret is needed. It runs every hour and from the Actions tab (Run workflow), and the branch changes
# only when a game is new or something went wrong. README: "Where the results go".
name: Game records
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      check:
        description: Collect nothing; try the page's own write to the index room (written, read back, removed) and say if it works
        type: boolean
        default: false
permissions: { contents: write }
concurrency: { group: game-records, cancel-in-progress: false }
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The records branch (made the first time)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin game-records; then
            git worktree add -B game-records records FETCH_HEAD
          else
            git worktree add --detach records
            git -C records checkout --orphan game-records
            git -C records rm -rf -q . || true
          fi
      - name: Collect the games
        run: node tools/pull-games.mjs records ${{ inputs.check && '--check' || '' }}
      - name: Keep what is new
        run: |
          cd records
          git add -A
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -q -m "Games: $(jq -r '"\(.games // 0) kept, \(.new // 0) new" + (if (.errors | length) > 0 then ", \(.errors | length) problems" else "" end) + (if .check then ", check " + (.check | tostring) else "" end)' status.json)"
          git push origin HEAD:game-records
