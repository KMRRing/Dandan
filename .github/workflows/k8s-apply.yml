# Load the lab's Kubernetes setup into a Rackspace Spot cloudspace (12 Nov 2026). The lab chat can't reach the cluster (its
# network allowlist), and the Rackspace console has no paste box, so a GitHub runner does it: it takes the cloudspace's
# kubeconfigs (secrets RS_KUBECONFIG, RS_KUBECONFIG_2 … RS_KUBECONFIG_9: one file from each cloudspace's Kubeconfig page) and the setup file (secret LAB_K8S_MANIFEST,
# dandan-lab-kubernetes.yaml, which holds the bucket key) and applies them. Nothing is printed but the resources' names.
# It runs from the Actions tab (Run workflow), or when lab/k8s/apply changes, so the lab chat can start it with a push.
name: Load the lab into Kubernetes
on:
  workflow_dispatch:
    inputs:
      restart:
        description: "Also restart every lab pod (rollout restart), so each picks up main's worker"
        type: boolean
        default: false
      restart_draining:
        description: "Restart only the lab pods that are draining (their log says a newer worker is on main), except those still running a shard of a job matching this pattern (e.g. zdref001|zceil001); empty: off"
        required: false
        default: ""
      remove_machine_of:
        description: "A lab worker pod's name (or part of it): the machine it runs on is cordoned (nothing new lands there), its pods stopped and the machine deleted from the cluster, so the pool replaces it; empty: off"
        required: false
        default: ""
      logs:
        description: "Pod or node names (comma-separated, any part of the name) whose lab worker's last 40 log lines to show, or 'unready' for every pod not running"
        required: false
        default: ""
  push:
    branches: [main]
    paths: [lab/k8s/apply]
permissions: { contents: read }
concurrency: { group: k8s-apply, cancel-in-progress: false }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/setup-kubectl@v4
      - uses: actions/checkout@v4
        with: { sparse-checkout: lab/k8s }
      - name: Apply the setup to each cluster and list what runs
        env:
          RS_KUBECONFIG: "${{ secrets.RS_KUBECONFIG }}"
          RS_KUBECONFIG_2: "${{ secrets.RS_KUBECONFIG_2 }}"
          RS_KUBECONFIG_3: "${{ secrets.RS_KUBECONFIG_3 }}"
          RS_KUBECONFIG_4: "${{ secrets.RS_KUBECONFIG_4 }}"
          RS_KUBECONFIG_5: "${{ secrets.RS_KUBECONFIG_5 }}"
          RS_KUBECONFIG_6: "${{ secrets.RS_KUBECONFIG_6 }}"
          RS_KUBECONFIG_7: "${{ secrets.RS_KUBECONFIG_7 }}"
          RS_KUBECONFIG_8: "${{ secrets.RS_KUBECONFIG_8 }}"
          RS_KUBECONFIG_9: "${{ secrets.RS_KUBECONFIG_9 }}"
          LAB_K8S_MANIFEST: "${{ secrets.LAB_K8S_MANIFEST }}"
          LOGS: "${{ inputs.logs }}"
          REMOVE_OF: "${{ inputs.remove_machine_of }}"
        run: |
          if [ -z "$LAB_K8S_MANIFEST" ]; then echo "::error::Add the LAB_K8S_MANIFEST secret first"; exit 1; fi
          # Docker Hub refuses many anonymous pulls from shared addresses; Google's mirror of the same official image doesn't. The image
          # is swapped in the file before it is applied, so a rerun with nothing changed leaves the running workers alone (12 Nov:
          # swapping it after the apply restarted every worker on each run)
          printf '%s\n' "$LAB_K8S_MANIFEST" | sed 's#image: node:22-bookworm#image: mirror.gcr.io/library/node:22-bookworm#' > "$RUNNER_TEMP/m.yaml"
          # one kubeconfig secret per cloudspace (13 Nov: Chicago, then Hong Kong); the same setup goes to each
          # 26 Nov 2026 (Fable 16:20Z): the San Jose cloudspace (kmr-ring1-sjc, its kubeconfig in RS_KUBECONFIG_6) runs the GPU
          # runner only, made from this same setup by lab/k8s/gpu-setup.py, so the store key stays in the secret; the CPU clusters
          # never get the GPU setup. A cluster is the GPU one when its name or address has GPU_MATCH in it
          GPU_MATCH=sjc
          echo "kubeconfig secrets present: $(for v in RS_KUBECONFIG RS_KUBECONFIG_2 RS_KUBECONFIG_3 RS_KUBECONFIG_4 RS_KUBECONFIG_5 RS_KUBECONFIG_6 RS_KUBECONFIG_7 RS_KUBECONFIG_8 RS_KUBECONFIG_9; do [ -n "${!v}" ] && printf '%s ' "$v"; done)" | tee -a "$GITHUB_STEP_SUMMARY"
          n=0
          for name in RS_KUBECONFIG RS_KUBECONFIG_2 RS_KUBECONFIG_3 RS_KUBECONFIG_4 RS_KUBECONFIG_5 RS_KUBECONFIG_6 RS_KUBECONFIG_7 RS_KUBECONFIG_8 RS_KUBECONFIG_9; do
            kc="${!name}"; [ -n "$kc" ] || continue; n=$((n+1))
            export KUBECONFIG="$RUNNER_TEMP/kc"; printf '%s\n' "$kc" > "$KUBECONFIG"; chmod 600 "$KUBECONFIG"
            cluster=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}' 2>/dev/null)
            echo "## $cluster ($name)" | tee -a "$GITHUB_STEP_SUMMARY"
            server=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null)
            if printf '%s %s' "$cluster" "$server" | grep -qi "$GPU_MATCH"; then
              { python3 lab/k8s/gpu-setup.py "$RUNNER_TEMP/m.yaml" "$RUNNER_TEMP/g.yaml" "$cluster" || { echo "GPU setup not made"; rm -f "$KUBECONFIG"; continue; }
                kubectl delete daemonset dandan-lab --ignore-not-found 2>&1
                kubectl apply -f "$RUNNER_TEMP/g.yaml" 2>&1 | sed -E 's/[A-Za-z0-9+\/=_-]{40,}/[hidden]/g'
                rm -f "$RUNNER_TEMP/g.yaml"
                if [ "${{ inputs.restart }}" = "true" ]; then kubectl rollout restart deployment/dandan-gpu 2>&1; fi
                sleep 20
                echo "### GPU machines"; echo '```'
                kubectl get nodes -o custom-columns='NODE:.metadata.name,READY:.status.conditions[?(@.type=="Ready")].status,GPUS:.status.allocatable.nvidia\.com/gpu,TYPE:.metadata.labels.node\.kubernetes\.io/instance-type' 2>&1
                echo '```'
                gpus=$(kubectl get nodes -o jsonpath='{range .items[*]}{.status.allocatable.nvidia\.com/gpu}{"\n"}{end}' 2>/dev/null | awk '$1>0{s+=$1} END{print s+0}')
                plugin=$(kubectl get pods -A --no-headers 2>/dev/null | grep -ciE 'nvidia-device-plugin|gpu-operator')
                echo "GPUs Kubernetes can hand out: $gpus; NVIDIA device plugin or GPU operator pods: $plugin"
                if [ "$gpus" = "0" ]; then
                  echo "::warning::No GPU is visible to Kubernetes on $cluster."
                  echo "No GPU is visible to Kubernetes here. If the machine has one, it lacks the NVIDIA driver, the container runtime or the device plugin: NVIDIA's GPU Operator installs all three (helm install gpu-operator nvidia/gpu-operator -n gpu-operator --create-namespace); with the driver already on the machine, the device plugin alone (NVIDIA k8s-device-plugin's DaemonSet) is enough. The runner's pod stays Pending until then."
                fi
                echo "### GPU runner"; echo '```'
                kubectl get pods -l app=dandan-gpu -o wide --no-headers 2>&1 | cut -c1-160
                for pod in $(kubectl get pods -l app=dandan-gpu --no-headers 2>/dev/null | awk '{print $1}'); do
                  kubectl describe pod "$pod" 2>/dev/null | sed -n '/^Events:/,$p' | tail -6 | cut -c1-200
                  kubectl logs "$pod" --tail=25 2>&1 | sed -E -e '/[Kk][Ee][Yy]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn]|BEGIN|END /c\[line hidden]' -e 's/[A-Za-z0-9+\/=_-]{40,}/[hidden]/g' | cut -c1-200
                done
                echo '```'
              } | tee -a "$GITHUB_STEP_SUMMARY"
              rm -f "$KUBECONFIG"; continue
            fi
            kubectl delete deployment dandan-gpu --ignore-not-found >/dev/null 2>&1
            # 26 Nov 2026 (Fable 16:20Z): a bad machine's pod (dandan-lab-vcp78-8566) is recreated there by the DaemonSet, so it is
            # the machine that goes: cordoned, emptied and deleted from the cluster; the pool brings up a fresh one in its place
            if [ -n "$REMOVE_OF" ]; then
              node=$(kubectl get pods -l app=dandan-lab -o wide --no-headers 2>/dev/null | awk -v p="$REMOVE_OF" 'index($1,p){print $7; exit}')
              if [ -n "$node" ]; then
                { echo "### Removing machine $node (pod matching $REMOVE_OF)"; echo '```'
                  kubectl cordon "$node" 2>&1
                  kubectl drain "$node" --ignore-daemonsets --delete-emptydir-data --force --timeout=90s 2>&1 | tail -3
                  kubectl delete pod -l app=dandan-lab --field-selector "spec.nodeName=$node" --wait=false 2>&1
                  kubectl delete node "$node" --wait=false 2>&1
                  echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
              fi
            fi
            # each worker is told which cluster it runs in (LAB_POOL), for the Fleet page's cost tiles (13 Nov)
            sed "s#^\( *\)image: \(.*node:22-bookworm\)#\1image: \2\n\1env: [{ name: LAB_POOL, value: \"$cluster\" }]#" "$RUNNER_TEMP/m.yaml" > "$RUNNER_TEMP/m1.yaml"
            kubectl apply -f "$RUNNER_TEMP/m1.yaml" 2>&1 | sed -E 's/[A-Za-z0-9+\/=_-]{40,}/[hidden]/g'
            # 13 Nov: workers started before the drain-on-new-version change never restart by themselves
            if [ "${{ inputs.restart }}" = "true" ]; then kubectl rollout restart daemonset/dandan-lab 2>&1; fi
            # 23 Nov 2026 (Fable 14:45Z): a worker push leaves each machine draining, its slots idle until its longest shard ends;
            # this restarts the draining pods at once (a stop hands their shards back), sparing any still running a shard of KEEP
            KEEP="${{ inputs.restart_draining }}"
            if [ -n "$KEEP" ]; then
              dr=0; kept=0; gone=""
              for pod in $(kubectl get pods -l app=dandan-lab --no-headers 2>/dev/null | awk '$3=="Running"{print $1}'); do
                lg=$(kubectl logs "$pod" --since=8h 2>/dev/null)
                printf '%s\n' "$lg" | grep -q "a newer worker is on main" || continue
                dr=$((dr+1))
                started=$(printf '%s\n' "$lg" | grep -oE "slot [0-9]+: [a-z0-9-]+/[0-9]+ [a-z0-9-]+\.mjs" | grep -E ": ($KEEP)/" | awk '{print $3}' | sort -u)
                ended=$(printf '%s\n' "$lg" | grep -oE "slot [0-9]+: [a-z0-9-]+/[0-9]+ ended" | awk '{print $3}' | sort -u)
                live=$(comm -23 <(printf '%s\n' "$started" | sed '/^$/d') <(printf '%s\n' "$ended" | sed '/^$/d') | wc -l)
                if [ "$live" -gt 0 ]; then kept=$((kept+1)); else gone="$gone $pod"; fi
              done
              n_gone=$(echo $gone | wc -w)
              [ -z "$gone" ] || kubectl delete pod $gone --wait=false >/dev/null 2>&1
              echo "draining pods: $dr; restarted $n_gone; kept $kept (still running a shard of $KEEP)" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            rm -f "$RUNNER_TEMP/m1.yaml"
            sleep 15
            { echo "### Machines: $(kubectl get nodes --no-headers 2>/dev/null | awk '$2=="Ready"' | wc -l) ready of $(kubectl get nodes --no-headers 2>/dev/null | wc -l)"
              echo '```'; kubectl get nodes --no-headers 2>&1 | awk '$2!="Ready"' | cut -c1-120; echo '```'
              echo "### Lab workers: $(kubectl get pods -l app=dandan-lab --no-headers 2>/dev/null | grep -c ' Running ') running of $(kubectl get pods -l app=dandan-lab --no-headers 2>/dev/null | wc -l)"
              echo '```'; kubectl get pods -l app=dandan-lab --no-headers 2>&1 | grep -v ' Running ' | cut -c1-120; echo '```'
              echo '### Recent problems'; echo '```'; kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp 2>&1 | grep -v NetworkNotReady | tail -8 | cut -c1-220; echo '```'
              # (13 Nov, the fleet director: a red machine's own log) the worker's last lines, long tokens and key-like lines blanked
              if [ -n "$LOGS" ]; then
                pods=$(kubectl get pods -l app=dandan-lab -o wide --no-headers 2>/dev/null | awk -v want="$LOGS" 'BEGIN{n=split(want,w,",")} { for(i=1;i<=n;i++) if ((w[i]=="unready" && $3!="Running") || (w[i]!="unready" && w[i]!="" && (index($1,w[i]) || index($7,w[i])))) { print $1; break } }')
                for pod in $pods; do echo "### log $pod"; echo '```'; kubectl logs "$pod" --tail=40 2>&1 | sed -E -e '/[Kk][Ee][Yy]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn]|BEGIN|END /c\[line hidden]' -e 's/[A-Za-z0-9+\/=_-]{40,}/[hidden]/g' | cut -c1-220; echo '```'; done
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f "$KUBECONFIG"
          done
          rm -f "$RUNNER_TEMP/m.yaml"
          [ "$n" -gt 0 ] || { echo "::error::No kubeconfig secret (RS_KUBECONFIG, RS_KUBECONFIG_2 … _9)"; exit 1; }
