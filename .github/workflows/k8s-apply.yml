# Load the lab's Kubernetes setup into a Rackspace Spot cloudspace (12 Nov 2026). The lab chat can't reach the cluster (its
# network allowlist), and the Rackspace console has no paste box, so a GitHub runner does it: it takes the cloudspace's
# kubeconfigs (secrets RS_KUBECONFIG, RS_KUBECONFIG_2 … RS_KUBECONFIG_9: one file from each cloudspace's Kubeconfig page) and the setup file (secret LAB_K8S_MANIFEST,
# dandan-lab-kubernetes.yaml, which holds the bucket key) and applies them. Nothing is printed but the resources' names.
# It runs from the Actions tab (Run workflow), or when lab/k8s/apply changes, so the lab chat can start it with a push.
name: Load the lab into Kubernetes
on:
  workflow_dispatch:
    inputs:
      restart:
        description: "Also restart every lab pod (rollout restart), so each picks up main's worker"
        type: boolean
        default: false
      logs:
        description: "Pod or node names (comma-separated, any part of the name) whose lab worker's last 40 log lines to show, or 'unready' for every pod not running"
        required: false
        default: ""
  push:
    branches: [main]
    paths: [lab/k8s/apply]
permissions: { contents: read }
concurrency: { group: k8s-apply, cancel-in-progress: false }
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: azure/setup-kubectl@v4
      - name: Apply the setup to each cluster and list what runs
        env:
          RS_KUBECONFIG: "${{ secrets.RS_KUBECONFIG }}"
          RS_KUBECONFIG_2: "${{ secrets.RS_KUBECONFIG_2 }}"
          RS_KUBECONFIG_3: "${{ secrets.RS_KUBECONFIG_3 }}"
          RS_KUBECONFIG_4: "${{ secrets.RS_KUBECONFIG_4 }}"
          RS_KUBECONFIG_5: "${{ secrets.RS_KUBECONFIG_5 }}"
          RS_KUBECONFIG_6: "${{ secrets.RS_KUBECONFIG_6 }}"
          RS_KUBECONFIG_7: "${{ secrets.RS_KUBECONFIG_7 }}"
          RS_KUBECONFIG_8: "${{ secrets.RS_KUBECONFIG_8 }}"
          RS_KUBECONFIG_9: "${{ secrets.RS_KUBECONFIG_9 }}"
          LAB_K8S_MANIFEST: "${{ secrets.LAB_K8S_MANIFEST }}"
          LOGS: "${{ inputs.logs }}"
        run: |
          if [ -z "$LAB_K8S_MANIFEST" ]; then echo "::error::Add the LAB_K8S_MANIFEST secret first"; exit 1; fi
          # Docker Hub refuses many anonymous pulls from shared addresses; Google's mirror of the same official image doesn't. The image
          # is swapped in the file before it is applied, so a rerun with nothing changed leaves the running workers alone (12 Nov:
          # swapping it after the apply restarted every worker on each run)
          printf '%s\n' "$LAB_K8S_MANIFEST" | sed 's#image: node:22-bookworm#image: mirror.gcr.io/library/node:22-bookworm#' > "$RUNNER_TEMP/m.yaml"
          # one kubeconfig secret per cloudspace (13 Nov: Chicago, then Hong Kong); the same setup goes to each
          n=0
          for name in RS_KUBECONFIG RS_KUBECONFIG_2 RS_KUBECONFIG_3 RS_KUBECONFIG_4 RS_KUBECONFIG_5 RS_KUBECONFIG_6 RS_KUBECONFIG_7 RS_KUBECONFIG_8 RS_KUBECONFIG_9; do
            kc="${!name}"; [ -n "$kc" ] || continue; n=$((n+1))
            export KUBECONFIG="$RUNNER_TEMP/kc"; printf '%s\n' "$kc" > "$KUBECONFIG"; chmod 600 "$KUBECONFIG"
            cluster=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}' 2>/dev/null)
            echo "## $cluster" | tee -a "$GITHUB_STEP_SUMMARY"
            # each worker is told which cluster it runs in (LAB_POOL), for the Fleet page's cost tiles (13 Nov)
            sed "s#^\( *\)image: \(.*node:22-bookworm\)#\1image: \2\n\1env: [{ name: LAB_POOL, value: \"$cluster\" }]#" "$RUNNER_TEMP/m.yaml" > "$RUNNER_TEMP/m1.yaml"
            kubectl apply -f "$RUNNER_TEMP/m1.yaml" 2>&1 | sed -E 's/[A-Za-z0-9+\/=_-]{40,}/[hidden]/g'
            # 13 Nov: workers started before the drain-on-new-version change never restart by themselves
            if [ "${{ inputs.restart }}" = "true" ]; then kubectl rollout restart daemonset/dandan-lab 2>&1; fi
            rm -f "$RUNNER_TEMP/m1.yaml"
            sleep 15
            { echo "### Machines: $(kubectl get nodes --no-headers 2>/dev/null | awk '$2=="Ready"' | wc -l) ready of $(kubectl get nodes --no-headers 2>/dev/null | wc -l)"
              echo '```'; kubectl get nodes --no-headers 2>&1 | awk '$2!="Ready"' | cut -c1-120; echo '```'
              echo "### Lab workers: $(kubectl get pods -l app=dandan-lab --no-headers 2>/dev/null | grep -c ' Running ') running of $(kubectl get pods -l app=dandan-lab --no-headers 2>/dev/null | wc -l)"
              echo '```'; kubectl get pods -l app=dandan-lab --no-headers 2>&1 | grep -v ' Running ' | cut -c1-120; echo '```'
              echo '### Recent problems'; echo '```'; kubectl get events -A --field-selector type=Warning --sort-by=.lastTimestamp 2>&1 | grep -v NetworkNotReady | tail -8 | cut -c1-220; echo '```'
              # (13 Nov, the fleet director: a red machine's own log) the worker's last lines, long tokens and key-like lines blanked
              if [ -n "$LOGS" ]; then
                pods=$(kubectl get pods -l app=dandan-lab -o wide --no-headers 2>/dev/null | awk -v want="$LOGS" 'BEGIN{n=split(want,w,",")} { for(i=1;i<=n;i++) if ((w[i]=="unready" && $3!="Running") || (w[i]!="unready" && w[i]!="" && (index($1,w[i]) || index($7,w[i])))) { print $1; break } }')
                for pod in $pods; do echo "### log $pod"; echo '```'; kubectl logs "$pod" --tail=40 2>&1 | sed -E -e '/[Kk][Ee][Yy]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn]|BEGIN|END /c\[line hidden]' -e 's/[A-Za-z0-9+\/=_-]{40,}/[hidden]/g' | cut -c1-220; echo '```'; done
              fi
            } | tee -a "$GITHUB_STEP_SUMMARY"
            rm -f "$KUBECONFIG"
          done
          rm -f "$RUNNER_TEMP/m.yaml"
          [ "$n" -gt 0 ] || { echo "::error::No kubeconfig secret (RS_KUBECONFIG, RS_KUBECONFIG_2 … _9)"; exit 1; }
