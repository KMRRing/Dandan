# The Fleet page's data (lab/fleet.html): tools/fleet-snapshot.mjs copies what the page reads out of the lab bucket onto the
# fleet-status branch every 10 minutes, so the page loads plain files from GitHub instead of asking Google through a connector
# with a per-minute quota. The branch holds one commit, replaced each time (no history piles up). The key is the read-only
# fleet-reader account, stored as the LAB_READ_KEY secret (12 Nov 2026, Korbi).
# GitHub's schedule is unreliable here (games.yml's hourly runs come hours apart, and this one's never came), so a run started
# by hand (Run workflow), by schedule or by a push of this file keeps going itself: a snapshot every 10 minutes for 5½ hours, then it starts the next such run, unless
# one is already waiting.
name: Fleet status
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  # a change to this file or the snapshot script starts it too, so the lab chat (which can't dispatch runs) can restart it
  push:
    branches: [main]
    paths: [.github/workflows/fleet.yml, tools/fleet-snapshot.mjs]
permissions: { contents: write, actions: write }
concurrency: { group: fleet-status, cancel-in-progress: false }
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The match part files kept from the last run
        uses: actions/cache@v4
        with: { path: fleet-cache, key: "fleet-${{ github.run_id }}", restore-keys: fleet- }
      # kubectl for the summary's Kubernetes rows (nodes ready of joined, lab pods running, per cluster)
      - uses: azure/setup-kubectl@v4
      - name: Copy from the bucket, every 10 minutes
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          # the writer key, only for fleet/summary.json (the director's dashboard reads it through the Google connector)
          LAB_QUEUE_KEY: "${{ secrets.LAB_QUEUE_KEY }}"
          RS_KUBECONFIG: "${{ secrets.RS_KUBECONFIG }}"
          RS_KUBECONFIG_2: "${{ secrets.RS_KUBECONFIG_2 }}"
          RS_KUBECONFIG_3: "${{ secrets.RS_KUBECONFIG_3 }}"
          RS_KUBECONFIG_4: "${{ secrets.RS_KUBECONFIG_4 }}"
          RS_KUBECONFIG_5: "${{ secrets.RS_KUBECONFIG_5 }}"
          RS_KUBECONFIG_6: "${{ secrets.RS_KUBECONFIG_6 }}"
          RS_KUBECONFIG_7: "${{ secrets.RS_KUBECONFIG_7 }}"
          RS_KUBECONFIG_8: "${{ secrets.RS_KUBECONFIG_8 }}"
          RS_KUBECONFIG_9: "${{ secrets.RS_KUBECONFIG_9 }}"
          LOOP: "330"
          GH_TOKEN: "${{ github.token }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          printf '%s' "$LAB_QUEUE_KEY" > "$RUNNER_TEMP/wkey.json"; chmod 600 "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/wkey.json"
          # one {cluster, nodes, ready, pods, running} per kubeconfig secret; nothing from the clusters is printed
          k8s() {
            echo '['; sep=
            for name in RS_KUBECONFIG RS_KUBECONFIG_2 RS_KUBECONFIG_3 RS_KUBECONFIG_4 RS_KUBECONFIG_5 RS_KUBECONFIG_6 RS_KUBECONFIG_7 RS_KUBECONFIG_8 RS_KUBECONFIG_9; do
              kc="${!name}"; [ -n "$kc" ] || continue
              printf '%s\n' "$kc" > "$RUNNER_TEMP/kc"; chmod 600 "$RUNNER_TEMP/kc"; export KUBECONFIG="$RUNNER_TEMP/kc"
              c=$(kubectl config view --minify -o jsonpath='{.clusters[0].name}' 2>/dev/null)
              n=$(timeout 20 kubectl get nodes --no-headers 2>/dev/null); p=$(timeout 20 kubectl get pods -l app=dandan-lab --no-headers 2>/dev/null)
              printf '%s{"cluster":"%s","nodes":%d,"ready":%d,"pods":%d,"running":%d}' "$sep" "$c" \
                "$(grep -c . <<<"$n")" "$(awk '$2=="Ready"' <<<"$n" | grep -c .)" "$(grep -c . <<<"$p")" "$(grep -c ' Running ' <<<"$p")"; sep=,
            done; echo ']'; rm -f "$RUNNER_TEMP/kc"; unset KUBECONFIG
          }
          end=$(( $(date +%s) + LOOP * 60 ))
          while :; do
            t0=$(date +%s)
            rm -rf snap; git worktree prune
            if git fetch -q --depth 1 origin fleet-status; then git worktree add -q --detach snap FETCH_HEAD; else git worktree add -q --detach snap; git -C snap rm -rf -q . || true; fi
            if LAB_KEY="$RUNNER_TEMP/key.json" node tools/fleet-snapshot.mjs snap fleet-cache; then
              # the director's summary (tools/fleet-summary.mjs), on the branch and in the bucket
              k8s > "$RUNNER_TEMP/k8s.json" 2>/dev/null || echo '[]' > "$RUNNER_TEMP/k8s.json"
              if node tools/fleet-summary.mjs snap "$RUNNER_TEMP/k8s.json" > "$RUNNER_TEMP/summary.json"; then
                cp "$RUNNER_TEMP/summary.json" snap/summary.json
                [ -n "$LAB_QUEUE_KEY" ] && LAB_KEY="$RUNNER_TEMP/wkey.json" LAB_BUCKET=dandan-lab-807207481983 node tools/fleet-publish.mjs "$RUNNER_TEMP/summary.json" || echo "::warning::summary upload failed"
              else echo "::warning::summary failed"; fi
              # the Actions runs going on now, but this one (the page's GitHub card)
              gh run list -R "$GITHUB_REPOSITORY" --status in_progress -L 50 --json workflowName,displayTitle \
                --jq "{at: (now * 1000 | floor), running: ([.[] | select(.workflowName != \"Fleet status\")] | length), names: [.[] | select(.workflowName != \"Fleet status\") | .workflowName] | unique}" > snap/github.json || true
              (cd snap && git checkout -q --orphan "fresh-$t0" && git add -A && git commit -q -m "Fleet status $(date -u +%FT%TZ)" && git push -q -f origin HEAD:fleet-status) || echo "::warning::push failed"
            else echo "::warning::snapshot failed"; fi
            [ $(( $(date +%s) + 600 )) -lt "$end" ] || break
            left=$(( 600 - ($(date +%s) - t0) )); if [ "$left" -gt 0 ]; then sleep "$left"; fi
          done
          rm -f "$RUNNER_TEMP/key.json" "$RUNNER_TEMP/wkey.json"
      # every run, however it started, keeps going 5½ hours and then starts the next (12 Nov: a scheduled run waiting in the queue
      # made the loop end without a successor, and the scheduled run itself took one snapshot and stopped)
      - name: The next run
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          waiting=$(gh run list -R "$GITHUB_REPOSITORY" --workflow fleet.yml --json status -q '[.[] | select(.status == "queued" or .status == "pending" or .status == "waiting")] | length')
          if [ "$waiting" = "0" ]; then gh workflow run fleet.yml -R "$GITHUB_REPOSITORY" --ref main; else echo "a run is already waiting"; fi
