# The move of the lab's store to Backblaze B2 (16 Nov 2026, Korbi via ops; lab/store.mjs). One step at a time, by hand:
#   check   B2 answers: a write, read, list and delete under _check/, and the bucket's objects counted by top folder
#   copy    every object of the Google bucket but fleet/ and private/ copied to B2 (rclone): the first copy, before config only
#   catchup-dry, catchup   after config (Fable 21:44): what is new on Google copied over, but never over an object newer on B2
#           (--update --use-server-modtime), so nothing a worker wrote on B2 is undone; the dry run lists what it would copy.
#           From config to the last catch-up: no retire, requeue or spec edit (a copy would bring a deleted object back)
#   config  private/store.json written on the Google bucket from the secrets (a path nothing lists or copies to the public status
#           branch): workers switch to B2 within 10 minutes, and every GitHub run after it reads and writes B2 (fleet/ stays on Google)
#   verify  objects and bytes on both sides, then by top folder: objects missing on B2 and objects that differ, and objects written
#           to Google outside fleet/ in the last 30 minutes. It passes (Fable 21:44) when Google has been quiet for 30 minutes, a
#           catch-up has run after that, and nothing is missing on B2 outside claims/ and workers/ (sizes there, and of done marks,
#           differ by design once workers write on B2)
# The B2 key comes from the secrets LAB_B2_KEY_ID, LAB_B2_KEY, LAB_B2_ENDPOINT and is never printed; nothing here echoes it.
name: Store move (Google to B2)
on:
  workflow_dispatch:
    inputs:
      step: { description: "check, copy, config, catchup-dry, catchup or verify; copy-live, catchup-live, verify-live (the live set and the loop's window only: Korbi 17 Nov 15:15Z); back: Google again (private/store.json removed) and copy-back: what was written to B2 in the last 3 hours copied to Google", required: true, default: "check" }
permissions:
  contents: read
jobs:
  move:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      LAB_BUCKET: dandan-lab-807207481983
      LAB_B2_BUCKET: ML-queue
      LAB_B2_KEY_ID: "${{ secrets.LAB_B2_KEY_ID }}"
      LAB_B2_KEY: "${{ secrets.LAB_B2_KEY }}"
      LAB_B2_ENDPOINT: "${{ secrets.LAB_B2_ENDPOINT }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: rclone
        if: inputs.step != 'check' && inputs.step != 'config'
        run: curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null && rclone version | head -1
      - name: Run the step
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_QUEUE_KEY: "${{ secrets.LAB_QUEUE_KEY }}"
        run: |
          set -euo pipefail
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/rkey.json"; printf '%s' "$LAB_QUEUE_KEY" > "$RUNNER_TEMP/wkey.json"; chmod 600 "$RUNNER_TEMP"/*key.json
          # rclone's two stores, from the environment (no config file): gcs the Google bucket (read key), b2 the S3 store, path-style
          export RCLONE_CONFIG_GCS_TYPE="google cloud storage" RCLONE_CONFIG_GCS_SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/rkey.json" RCLONE_CONFIG_GCS_BUCKET_POLICY_ONLY=true
          export RCLONE_CONFIG_B2_TYPE=s3 RCLONE_CONFIG_B2_PROVIDER=Other RCLONE_CONFIG_B2_ACCESS_KEY_ID="$LAB_B2_KEY_ID" RCLONE_CONFIG_B2_SECRET_ACCESS_KEY="$LAB_B2_KEY"
          export RCLONE_CONFIG_B2_ENDPOINT="$LAB_B2_ENDPOINT" RCLONE_CONFIG_B2_FORCE_PATH_STYLE=true RCLONE_CONFIG_B2_NO_CHECK_BUCKET=true
          export RCLONE_CONFIG_B2_REGION="$(printf '%s' "$LAB_B2_ENDPOINT" | sed -E 's#^(https?://)?s3\.([^.]+)\..*#\2#')"
          # progress every minute in the live log (ops 19:50Z); many small objects, so wide parallelism: per-object latency is the limit
          R="--exclude fleet/** --exclude private/** --exclude _check/** --fast-list --retries 10 --low-level-retries 30 --stats 60s --stats-one-line --stats-log-level NOTICE"
          # the live set and the loop's window (Korbi 17 Nov 15:15Z: only these move; the rest stays on Google, read-only):
          # jobs/, retired/, cache/, and results/ of the open jobs, of the loop's batches (lab/zero/loop.json prefix) and of the filler's
          # (lab/filler.json prefix: the loop's games are the filler's batches, zps…, retired ones included). Not claims/ or workers/
          # (17 Nov 21:25Z): they are leases and beats the workers rewrite every 5 minutes on whichever store they use, and claims
          # vanish as shards finish, so a copy of them never settles (the first copy-live retried itself to the 6-hour limit on them)
          live() {
            { printf '%s\n' '- fleet/**' '- private/**' '- _check/**' '- claims/**' '- workers/**' '+ jobs/**' '+ retired/**' '+ cache/**' "+ results/$(node -e 'process.stdout.write(require("./lab/zero/loop.json").prefix)')*/**" "+ results/$(node -e 'process.stdout.write(require("./lab/filler.json").prefix)')*/**"
              rclone lsf "gcs:$LAB_BUCKET/jobs/" --files-only | sed -n 's/\.json$//p' | sed 's#^#+ results/#; s#$#/**#'; echo '- **'; } > "$RUNNER_TEMP/live.txt"
            echo "live set: $(grep -c '^+' "$RUNNER_TEMP/live.txt") patterns"
          }
          RL="${R//--exclude fleet\/\*\* --exclude private\/\*\* --exclude _check\/\*\* /}"   # the live steps' filter file holds the exclusions
          RL="${RL//--retries 10/--retries 3}"   # a whole-copy retry relists everything: 3 at most for the live steps
          case "${{ inputs.step }}" in
            copy-live)    live; rclone copy "gcs:$LAB_BUCKET" "b2:$LAB_B2_BUCKET" --filter-from "$RUNNER_TEMP/live.txt" $RL --transfers 192 --checkers 256 --size-only ;;
            catchup-live) live; rclone copy "gcs:$LAB_BUCKET" "b2:$LAB_B2_BUCKET" --filter-from "$RUNNER_TEMP/live.txt" $RL --transfers 192 --checkers 256 --update --use-server-modtime ;;
            verify-live)
              live; : > "$RUNNER_TEMP/miss.txt"
              rclone check "gcs:$LAB_BUCKET" "b2:$LAB_B2_BUCKET" --filter-from "$RUNNER_TEMP/live.txt" $RL --one-way --size-only --missing-on-dst "$RUNNER_TEMP/miss.txt" > "$RUNNER_TEMP/check.txt" 2>&1 || true
              tail -3 "$RUNNER_TEMP/check.txt"
              missing=$({ grep -v -E '^(claims|workers)/' "$RUNNER_TEMP/miss.txt" || true; } | wc -l)
              echo "## live set missing on B2 outside claims/ and workers/: $missing"; cut -d/ -f1-2 "$RUNNER_TEMP/miss.txt" | sort | uniq -c | sort -rn | head
              if [ "$missing" = 0 ]; then echo "VERIFY-LIVE: passed"; else echo "VERIFY-LIVE: not yet"; fi ;;
            check)  node lab/store-check.mjs ;;
            copy)   [ -z "$(LAB_KEY="$RUNNER_TEMP/rkey.json" node -e 'import("./lab/store.mjs").then(async m => { const { googleToken } = await import("./lab/lib.mjs"); const g = m.googleStore(process.env.LAB_BUCKET, googleToken); process.stdout.write((await g.get(m.STORE_CONFIG)) ? "set" : ""); })')" ] || { echo "the store has switched: use catchup, not copy"; exit 1; }
                    rclone copy "gcs:$LAB_BUCKET" "b2:$LAB_B2_BUCKET" $R --transfers 192 --checkers 256 --size-only ;;
            catchup-dry) rclone copy "gcs:$LAB_BUCKET" "b2:$LAB_B2_BUCKET" $R --transfers 192 --checkers 256 --update --use-server-modtime --dry-run 2>&1 | sed -n 's/.*NOTICE: \(.*\): Skipped copy.*/\1/p' | cut -d/ -f1 | sort | uniq -c | sed 's/^/would copy: /' ;;
            catchup) rclone copy "gcs:$LAB_BUCKET" "b2:$LAB_B2_BUCKET" $R --transfers 192 --checkers 256 --update --use-server-modtime ;;
            config) LAB_KEY="$RUNNER_TEMP/wkey.json" node lab/store-check.mjs --config ;;
            # back to Google (17 Nov 22:50Z: B2 answered 503 SlowDown after the switch; Korbi 17:33: with B2 issues, don't switch): the
            # workers read private/store.json every 10 minutes and, finding none, write to Google again
            back)   LAB_KEY="$RUNNER_TEMP/wkey.json" node -e 'import("./lab/store.mjs").then(async m => { const { googleToken } = await import("./lab/lib.mjs"); const g = m.googleStore(process.env.LAB_BUCKET, googleToken); await g.del(m.STORE_CONFIG); const t = await g.get(m.STORE_CONFIG); console.log(t ? "STORE-BACK: still there" : "STORE-BACK: done, the store is Google"); process.exit(t ? 1 : 0); })' ;;
            # what the workers wrote to B2 while it was the store, copied to Google (the writer key); objects older than 3 hours on B2
            # came from Google in the first place
            copy-back) export RCLONE_CONFIG_GCSW_TYPE="google cloud storage" RCLONE_CONFIG_GCSW_SERVICE_ACCOUNT_FILE="$RUNNER_TEMP/wkey.json" RCLONE_CONFIG_GCSW_BUCKET_POLICY_ONLY=true
                       C="--max-age 3h --retries 3 --low-level-retries 30 --stats 60s --stats-one-line --stats-log-level NOTICE --transfers 64 --checkers 64 --size-only"
                       # only where the workers write: jobs/, retired/, and the results of the filler's batches (a whole-bucket listing of B2
                       # ran for an hour and was stopped)
                       for d in jobs retired; do rclone copy "b2:$LAB_B2_BUCKET/$d" "gcsw:$LAB_BUCKET/$d" $C; done
                       P=$(node -e 'process.stdout.write(require("./lab/filler.json").prefix)')
                       for d in $(rclone lsf "b2:$LAB_B2_BUCKET/results/" --dirs-only | grep "^$P"); do echo "results/$d"; rclone copy "b2:$LAB_B2_BUCKET/results/$d" "gcsw:$LAB_BUCKET/results/$d" $C; done ;;
            verify)
              echo "## Google (fleet/ left out)"; rclone size "gcs:$LAB_BUCKET" $R --json
              echo "## B2"; rclone size "b2:$LAB_B2_BUCKET" $R --json
              # (Fable 20:10Z) every Google object must land in one of the three lists, so a check that failed to list B2 can't pass
              : > "$RUNNER_TEMP/match.txt"; : > "$RUNNER_TEMP/miss.txt"; : > "$RUNNER_TEMP/diff.txt"
              rclone check "gcs:$LAB_BUCKET" "b2:$LAB_B2_BUCKET" $R --one-way --size-only --match "$RUNNER_TEMP/match.txt" --missing-on-dst "$RUNNER_TEMP/miss.txt" --differ "$RUNNER_TEMP/diff.txt" > "$RUNNER_TEMP/check.txt" 2>&1 || true
              tail -3 "$RUNNER_TEMP/check.txt"
              by() { cut -d/ -f1 "$1" | sort | uniq -c | sort -rn; }
              echo "## missing on B2, by top folder"; by "$RUNNER_TEMP/miss.txt"
              echo "## different size on B2, by top folder (claims/, workers/ and done marks differ by design)"; by "$RUNNER_TEMP/diff.txt"
              quiet=$(rclone lsf "gcs:$LAB_BUCKET" $R -R --files-only --max-age 30m | wc -l)
              missing=$({ grep -v -E '^(claims|workers)/' "$RUNNER_TEMP/miss.txt" || true; } | wc -l)
              google=$(rclone lsf "gcs:$LAB_BUCKET" $R -R --files-only | wc -l)
              seen=$(( $(wc -l < "$RUNNER_TEMP/match.txt") + $(wc -l < "$RUNNER_TEMP/miss.txt") + $(wc -l < "$RUNNER_TEMP/diff.txt") ))
              echo "## Google objects: $google; matching + missing + different: $seen"
              echo "## written to Google outside fleet/ in the last 30 minutes: $quiet"
              echo "## missing on B2 outside claims/ and workers/: $missing"
              if [ "$quiet" = 0 ] && [ "$missing" = 0 ] && [ "$seen" = "$google" ]; then echo "VERIFY: passed (if a catch-up ran after Google went quiet)"; else echo "VERIFY: not yet"; fi ;;
            *) echo "unknown step"; exit 1 ;;
          esac
          rm -f "$RUNNER_TEMP"/*key.json
