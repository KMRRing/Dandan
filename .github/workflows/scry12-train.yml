# Scry 1.2 (16 Nov 2026, lab/zero/scry12.mjs): Zero's games replayed into records of events (lab/zero/scry12-pack.mjs, four
# side by side), the net trained on them (lab/zero/scry12_np.py), committed as lab/zero/nets/<name>-scry12.json. Reads the
# bucket with the read-only key.
name: Scry 1.2 (train)
on:
  workflow_dispatch:
    inputs:
      games: { description: "Zero game jobs to learn from, comma-separated", required: true }
      name: { description: "Name of the net (written as <name>-scry12.json)", required: true }
      args: { description: "More scry12_np.py arguments", required: false, default: "--d 32 --h 64 --epochs 8" }
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Train
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_BUCKET: dandan-lab-807207481983
        run: |
          pip install -q numpy
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          mkdir -p lab/zero/nets
          N="${{ inputs.name }}"; D="$RUNNER_TEMP/s"
          for k in 0 1 2 3; do LAB_KEY="$RUNNER_TEMP/key.json" node lab/zero/scry12-pack.mjs "$D$k" "${{ inputs.games }}" $k 4 > "$RUNNER_TEMP/p$k.txt" & done; wait
          rm -f "$RUNNER_TEMP/key.json"
          tail -n 1 "$RUNNER_TEMP"/p?.txt | tee -a "$GITHUB_STEP_SUMMARY"
          python3 lab/zero/scry12_np.py "${D}0,${D}1,${D}2,${D}3" "lab/zero/nets/$N-scry12.json" ${{ inputs.args }} | tee "$RUNNER_TEMP/log.txt"
          { echo '```'; tail -c 20000 "$RUNNER_TEMP/log.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the net
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/zero/nets/
          git commit -q -m "Scry 1.2 trained on GitHub: ${{ inputs.name }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep $((5 + RANDOM % 20)); done
          echo "::error::the net could not be pushed"; exit 1
