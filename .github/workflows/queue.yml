# Queue by commit (13 Nov 2026, Fable): job specs pushed to lab/queue/ are copied to jobs/ in the lab bucket, create-only
# (lab/queue-push.mjs), and lab/filler.json to fleet/filler.json. The bucket key is the LAB_QUEUE_KEY secret, added by Korbi
# in the repository's settings; it is written to a temporary file and never printed.
name: Queue lab jobs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["lab/queue/*.json", "lab/filler.json", "lab/fleet-sources.json"]
permissions: { contents: read }
concurrency: { group: lab-queue, cancel-in-progress: false }
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: The writer key
        env:
          LAB_QUEUE_KEY: "${{ secrets.LAB_QUEUE_KEY }}"
        run: |
          if [ -z "$LAB_QUEUE_KEY" ]; then echo "::error::Add the LAB_QUEUE_KEY secret (a bucket key that may write jobs/ and fleet/)"; exit 1; fi
          printf '%s' "$LAB_QUEUE_KEY" > "$RUNNER_TEMP/key.json" && chmod 600 "$RUNNER_TEMP/key.json"
      - name: Copy new specs to the bucket
        run: |
          LAB_KEY="$RUNNER_TEMP/key.json" LAB_BUCKET=dandan-lab-807207481983 node lab/queue-push.mjs "${{ github.sha }}" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/key.json"
