# Look inside lab machines that have gone quiet (12 Nov 2026). GitHub's runners can reach port 22, which the lab chat can't, so
# this logs in to each address with the Rackspace "dandan-lab" key (stored as the LAB_SSH_KEY secret: the private half, pasted
# whole) and runs read-only checks: cores seen, the lab service, its last log lines, and the end of the boot log.
# The boot log ran the startup script, which carries the bucket key, so every long token (40+ key-like characters) and every
# line mentioning a key is blanked before anything is kept. The results go to the fleet-diag branch as one file per address,
# replaced each run, and are shown in the run's summary.
name: Check lab machines
on:
  workflow_dispatch:
    inputs:
      hosts:
        description: "Addresses, comma-separated (e.g. 119.9.22.63,119.9.22.70)"
        required: true
permissions: { contents: write }
concurrency: { group: vm-check, cancel-in-progress: false }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Log in and look
        env:
          LAB_SSH_KEY: "${{ secrets.LAB_SSH_KEY }}"
          HOSTS: "${{ inputs.hosts }}"
        run: |
          if [ -z "$LAB_SSH_KEY" ]; then echo "::error::The LAB_SSH_KEY secret is missing"; exit 1; fi
          key="$RUNNER_TEMP/k"; printf '%s\n' "$LAB_SSH_KEY" > "$key"; chmod 600 "$key"
          mkdir -p out
          checks='echo "== cores"; nproc; grep -c ^processor /proc/cpuinfo; cat /sys/devices/system/cpu/online /sys/devices/system/cpu/offline 2>/dev/null
            echo "== memory"; free -g | head -2
            echo "== uptime"; uptime
            echo "== lab service"; systemctl status dandan-lab --no-pager 2>&1 | head -20
            echo "== lab log"; journalctl -u dandan-lab -n 50 --no-pager 2>&1
            echo "== node"; ls /opt 2>&1; pgrep -a node 2>&1 | cut -c1-200
            echo "== boot log"; tail -60 /var/log/cloud-init-output.log 2>&1'
          for h in ${HOSTS//,/ }; do
            f="out/$h.txt"; echo "# $h, checked $(date -u +%FT%TZ)" > "$f"; ok=
            for u in ubuntu root; do
              if timeout 60 ssh -i "$key" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o BatchMode=yes \
                   "$u@$h" "sudo -n bash -c '$checks' 2>&1 || bash -c '$checks'" >> "$f.raw" 2>&1; then ok=1; echo "# user $u" >> "$f"; break; fi
            done
            [ -n "$ok" ] || echo "# could not log in (tried ubuntu, root)" >> "$f"
            # Blank anything that could be a secret before it is kept or shown.
            [ -f "$f.raw" ] && sed -E -e '/[Kk][Ee][Yy]|[Ss][Ee][Cc][Rr][Ee][Tt]|[Tt][Oo][Kk][Ee][Nn]|[Pp][Aa][Ss][Ss][Ww]|BEGIN|END /c\[line hidden]' \
                                      -e 's/[A-Za-z0-9+\/=_-]{40,}/[hidden]/g' "$f.raw" >> "$f"
            rm -f "$f.raw"
            { echo "### $h"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
          rm -f "$key"
      - name: Keep the results on the fleet-diag branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q --depth 1 origin fleet-diag && git worktree add -q --detach d FETCH_HEAD || { git worktree add -q --detach d; git -C d rm -rf -q . ; }
          cp out/*.txt d/
          git -C d add -A && git -C d commit -q -m "Machine check $(date -u +%FT%TZ)" && git -C d push -q -f origin HEAD:refs/heads/fleet-diag || true
