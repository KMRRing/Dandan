# The Medium-free move-picker trained on NumPy on a GitHub runner (14 Nov 2026, Fable No. 9 points 4-5): lab/fetch-ex.mjs packs
# the export jobs' every-move decisions from the bucket (read-only key), lab/policy_np.py trains form mlp (mpN's) or head (the
# policy head), and the model is committed as lab/policy/<name>.json with its metrics in lab/policy-runs/<name>.jsonl, which
# lab/plus-match.mjs plays as plusfree@policy/<name>.json. One training a run.
name: Train (move-picker, NumPy)
on:
  workflow_dispatch:
    inputs:
      exports: { description: "Export jobs to train on, comma-separated", required: true }
      form: { description: "mlp (mpN's form) or head (the policy head)", required: true, default: "head" }
      h1: { description: "First hidden layer (head: the trunk's first)", required: true, default: "128" }
      h2: { description: "Second hidden layer (head: the trunk's output, the marks' vector size)", required: true, default: "64" }
      epochs: { description: "Epochs", required: true, default: "6" }
      light: { description: "Weight of a decision that is not Deep (Deep ones 1)", required: true, default: "1" }
      name: { description: "Name (lab/policy/<name>.json)", required: true }
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Pack the exports
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_BUCKET: dandan-lab-807207481983
        run: |
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          LAB_KEY="$RUNNER_TEMP/key.json" node lab/fetch-ex.mjs "$RUNNER_TEMP/ex" "${{ inputs.exports }}" every | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$RUNNER_TEMP/key.json"
      - name: Train
        run: |
          pip install -q numpy
          python3 lab/policy_np.py "$RUNNER_TEMP/ex" "$RUNNER_TEMP/model.json" --form "${{ inputs.form }}" --h1 "${{ inputs.h1 }}" --h2 "${{ inputs.h2 }}" --epochs "${{ inputs.epochs }}" --light "${{ inputs.light }}" | tee "$RUNNER_TEMP/log.txt"
          { echo '```'; tail -c 20000 "$RUNNER_TEMP/log.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the model
        run: |
          mkdir -p lab/policy lab/policy-runs
          cp "$RUNNER_TEMP/model.json" "lab/policy/${{ inputs.name }}.json"
          node -e '
            const fs = require("fs"), m = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            fs.writeFileSync(`lab/policy-runs/${process.argv[2]}.jsonl`, JSON.stringify({ name: process.argv[2], exports: process.argv[3], form: process.argv[4], h1: process.argv[5], h2: process.argv[6], trainer: "policy_np.py", at: new Date().toISOString(), metrics: m.metrics }) + "\n");
          ' "$RUNNER_TEMP/model.json" "${{ inputs.name }}" "${{ inputs.exports }}" "${{ inputs.form }}" "${{ inputs.h1 }}" "${{ inputs.h2 }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/policy/*.json lab/policy-runs/
          git commit -q -m "Move-picker trained on GitHub (NumPy): ${{ inputs.name }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep $((5 + RANDOM % 20)); done
          echo "::error::the model could not be pushed"; exit 1
