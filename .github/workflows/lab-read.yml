# A read-only lab script on a GitHub runner, for summaries that need no lab machine (13 Nov 2026): the bucket read with the
# fleet-reader key, the output in the run's summary.
name: Lab script (read-only)
on:
  workflow_dispatch:
    inputs:
      script: { description: "Script in lab/ (read-only ones: decided-share.mjs, departures-sum.mjs, gate-sum.mjs, …)", required: true }
      args: { description: "Its arguments", required: false, default: "" }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_BUCKET: dandan-lab-807207481983
          SCRIPT: "${{ inputs.script }}"
          ARGS: "${{ inputs.args }}"
        run: |
          case "$SCRIPT" in *[!A-Za-z0-9._-]*) echo "bad script name"; exit 1;; esac
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          LAB_KEY="$RUNNER_TEMP/key.json" node --max-semi-space-size=32 "lab/$SCRIPT" $ARGS | tee "$RUNNER_TEMP/out.txt"
          rm -f "$RUNNER_TEMP/key.json"
          { echo '```'; tail -c 60000 "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
