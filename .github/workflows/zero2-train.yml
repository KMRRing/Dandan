# Zero 2's nets (16 Nov 2026, lab/zero/zero2.mjs: stages 1-2 of the path to the general solution): Zero's games replayed with
# Scry 1.2 (lab/zero/nets/<scry>-scry12.json, trained by scry12-train.yml) into one policy pack (moves and answers together,
# every target in full) and raw value rows (lab/zero/replay-pack2.mjs, four side by side, merged); the raw value net with its
# deck-out output (value_np.py --aux) and the one policy with soft targets (policy_np.py). Committed as
# lab/zero/nets/<name>-value2.json, -policy2.json, with a copy of the Scry as <name>-scry12.json.
name: Zero 2 (train)
on:
  workflow_dispatch:
    inputs:
      games: { description: "Zero game jobs to learn from, comma-separated", required: true }
      name: { description: "Name of the nets", required: true }
      scry: { description: "Scry 1.2 to pack with (lab/zero/nets/<scry>-scry12.json)", required: true }
      value: { description: "Value net shape", required: true, default: "128x64" }
      value_args: { description: "More value_np.py arguments", required: false, default: "--lr 3e-4 --wd 0.1 --aux 0.1 --epochs 8" }
      policy_args: { description: "More policy_np.py arguments", required: false, default: "--h1 128 --h2 64 --epochs 8 --decay 0.9 --soft 0.02" }
      vblend: { description: "Share of the search's value in the value targets", required: false, default: "0.5" }
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Train
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_BUCKET: dandan-lab-807207481983
        run: |
          pip install -q numpy
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          N="${{ inputs.name }}"; S="lab/zero/nets/${{ inputs.scry }}-scry12.json"; D="$RUNNER_TEMP/r"
          for k in 0 1 2 3; do VBLEND="${{ inputs.vblend }}" LAB_KEY="$RUNNER_TEMP/key.json" node lab/zero/replay-pack2.mjs "$D$k" "${{ inputs.games }}" "$S" $k 4 > "$RUNNER_TEMP/t$k.txt" & done; wait
          rm -f "$RUNNER_TEMP/key.json"
          tail -n 1 "$RUNNER_TEMP"/t?.txt | tee -a "$GITHUB_STEP_SUMMARY"
          python3 lab/zero/pack-merge.py "$D" "${D}0" "${D}1" "${D}2" "${D}3" | tee -a "$GITHUB_STEP_SUMMARY"
          rm -rf "${D}"?/
          python3 lab/zero/value_np.py "$D/v" "lab/zero/nets/$N-value2.json" --shape "${{ inputs.value }}" ${{ inputs.value_args }} | tee -a "$RUNNER_TEMP/log.txt"
          python3 lab/policy_np.py "$D/a" "lab/zero/nets/$N-policy2.json" --form head ${{ inputs.policy_args }} | tee -a "$RUNNER_TEMP/log.txt"
          [ "$S" = "lab/zero/nets/$N-scry12.json" ] || cp "$S" "lab/zero/nets/$N-scry12.json"
          { echo '```'; tail -c 20000 "$RUNNER_TEMP/log.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the nets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/zero/nets/
          git commit -q -m "Zero 2 nets trained on GitHub: ${{ inputs.name }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep $((5 + RANDOM % 20)); done
          echo "::error::the nets could not be pushed"; exit 1
