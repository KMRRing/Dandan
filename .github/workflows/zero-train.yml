# Zero's nets for the next generation (14 Nov 2026, Fable No. 12): from Zero's own games only (lab/zero/zero-play.mjs jobs), the
# value net (lab/zero/value_np.py, results only, rows after any random move) and the policy head (lab/policy_np.py on the searched
# decisions, pick target), committed as lab/zero/nets/<name>-value.json and <name>-policy.json for the next generation's shards.
# Reads the bucket with the read-only key; no lab machine taken.
name: Zero (train a generation's nets)
on:
  workflow_dispatch:
    inputs:
      games: { description: "Zero game jobs to learn from (the last three generations), comma-separated", required: true }
      name: { description: "Name of the nets (lab/zero/nets/<name>-value.json, -policy.json)", required: true }
      value: { description: "Value net shape (e.g. 64x32), or - for none", required: true, default: "64x32" }
      form: { description: "Policy form: head, mlp, or - for none", required: true, default: "head" }
      h1: { description: "Policy first layer", required: true, default: "128" }
      h2: { description: "Policy second layer", required: true, default: "64" }
      epochs: { description: "Policy epochs", required: true, default: "8" }
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Train
        env:
          LAB_READ_KEY: "${{ secrets.LAB_READ_KEY }}"
          LAB_BUCKET: dandan-lab-807207481983
        run: |
          pip install -q numpy
          printf '%s' "$LAB_READ_KEY" > "$RUNNER_TEMP/key.json"
          mkdir -p lab/zero/nets
          if [ "${{ inputs.value }}" != "-" ]; then
            LAB_KEY="$RUNNER_TEMP/key.json" node lab/zero/fetch-values.mjs "$RUNNER_TEMP/v" "${{ inputs.games }}" | tee -a "$GITHUB_STEP_SUMMARY"
            python3 lab/zero/value_np.py "$RUNNER_TEMP/v" "lab/zero/nets/${{ inputs.name }}-value.json" --shape "${{ inputs.value }}" | tee -a "$RUNNER_TEMP/log.txt"
          fi
          if [ "${{ inputs.form }}" != "-" ]; then
            LAB_KEY="$RUNNER_TEMP/key.json" node lab/fetch-ex.mjs "$RUNNER_TEMP/p" "${{ inputs.games }}" every | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$(node -e 'console.log(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).decisions)' "$RUNNER_TEMP/p/meta.json")" -gt 0 ]; then
              python3 lab/policy_np.py "$RUNNER_TEMP/p" "lab/zero/nets/${{ inputs.name }}-policy.json" --form "${{ inputs.form }}" --h1 "${{ inputs.h1 }}" --h2 "${{ inputs.h2 }}" --epochs "${{ inputs.epochs }}" --decay 0.9 | tee -a "$RUNNER_TEMP/log.txt"
            fi
          fi
          rm -f "$RUNNER_TEMP/key.json"
          { echo '```'; tail -c 20000 "$RUNNER_TEMP/log.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the nets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/zero/nets/
          git commit -q -m "Zero nets trained on GitHub: ${{ inputs.name }}" || exit 0
          for i in 1 2 3 4 5 6 7 8; do if git pull -q --rebase origin main && git push -q origin HEAD:main; then exit 0; fi; git rebase --abort 2>/dev/null || true; sleep $((5 + RANDOM % 20)); done
          echo "::error::the nets could not be pushed"; exit 1
