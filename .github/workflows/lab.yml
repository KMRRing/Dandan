# The lab's heavy jobs, run on GitHub's machines instead of a session's two cores (9 November 2026). A session starts it
# (Actions → Lab → Run workflow, or `gh api -X POST repos/KMRRing/dandan/actions/workflows/lab.yml/dispatches -f ref=main -f
# 'inputs[script]=review.mjs' …`), the kept games are checked out from the `game-records` branch, the script runs over a
# share of them on each of `shards` jobs, and what it printed and wrote goes to the `lab-results` branch under
# `<run id>-<script>/`, where a session reads it with git. `args` is the script's command line with these filled in:
#   {file}   one kept game (the script runs once for each game of the job's share, four at a time)
#   {games}  the folder of kept games (the script runs once a job and takes {shard} and {shards} to pick its share)
#   {shard} {shards}  this job's number and how many there are      {out}  a file to write (one for each game or job)
# e.g. script review.mjs, args "{file} 256 0 0.03" (the human seat of every game), or
#      script endgame-count.mjs, args "{games} {out} {shard} {shards} 1000000 40000" (README, "The end of the library").
# Nothing here changes the app: it is not part of `sw.js`, and the tests do not run it.
name: Lab
on:
  workflow_dispatch:
    inputs:
      script: { description: "A script in lab/ (review.mjs, endgame-count.mjs, regret.mjs…)", required: true }
      args: { description: "Its arguments, with {file} {games} {shard} {shards} {out} filled in", default: "{file}" }
      shards: { description: "Jobs to share the work over (at most 20 run at once on a free account)", default: "14" }
permissions: { contents: write }
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: { matrix: "${{ steps.m.outputs.matrix }}" }
    steps:
      - id: m
        env: { SHARDS: "${{ inputs.shards }}", SCRIPT: "${{ inputs.script }}" }
        run: |
          [[ "$SCRIPT" =~ ^[a-z0-9-]+\.mjs$ ]] || { echo "::error::script must be a name like review.mjs"; exit 1; }
          [[ "$SHARDS" =~ ^[0-9]+$ ]] && [ "$SHARDS" -ge 1 ] && [ "$SHARDS" -le 60 ] || { echo "::error::shards must be 1 to 60"; exit 1; }
          echo "matrix=$(seq 0 $((SHARDS - 1)) | jq -cs .)" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy: { fail-fast: false, matrix: { shard: "${{ fromJSON(needs.plan.outputs.matrix) }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: game-records, path: records }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Run this job's share
        env: { SCRIPT: "${{ inputs.script }}", ARGS: "${{ inputs.args }}", SHARD: "${{ matrix.shard }}", SHARDS: "${{ inputs.shards }}" }
        run: |
          mkdir out; games=records/games
          fill() { local a=$1; a=${a//\{games\}/$games}; a=${a//\{shard\}/$SHARD}; a=${a//\{shards\}/$SHARDS}; a=${a//\{file\}/$2}; a=${a//\{out\}/$3}; echo "$a"; }
          if [[ "$ARGS" == *"{file}"* ]]; then
            ls $games/*.json | awk -v s="$SHARD" -v n="$SHARDS" '(NR - 1) % n == s' > out/files.txt
            export SCRIPT ARGS; export -f fill; export games
            xargs -a out/files.txt -P4 -I{} bash -c 'b=$(basename {} .json); set -f; node lab/$SCRIPT $(fill "$ARGS" {} out/$b.jsonl) > out/$b.txt 2>&1 || echo "failed: {}" >> out/failed.txt'
          else
            set -f; node lab/$SCRIPT $(fill "$ARGS" "" out/part-$SHARD.jsonl) > out/stdout-$SHARD.txt 2>&1
          fi
      - uses: actions/upload-artifact@v4
        with: { name: "lab-${{ matrix.shard }}", path: out, if-no-files-found: ignore }
  collect:
    needs: run
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: "lab-*", merge-multiple: true, path: results }
      - name: Keep the results on lab-results
        env: { SCRIPT: "${{ inputs.script }}", ARGS: "${{ inputs.args }}", RUN: "${{ github.run_id }}" }
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          dir="$RUN-${SCRIPT%.mjs}"
          if git fetch origin lab-results; then git worktree add -B lab-results keep FETCH_HEAD
          else git worktree add --detach keep; git -C keep checkout --orphan lab-results; git -C keep rm -rf -q . || true; fi
          mkdir -p "keep/$dir"; cp -r results/. "keep/$dir/"; rm -f "keep/$dir/files.txt"
          echo "$SCRIPT $ARGS (commit $GITHUB_SHA)" > "keep/$dir/settings.txt"
          cd keep; git add -A; git commit -qm "$dir"
          for try in 1 2 3 4 5; do git push -q origin HEAD:lab-results && break; git pull -q --rebase origin lab-results; done
          echo "### Lab: $SCRIPT — results on branch lab-results, folder $dir" >> "$GITHUB_STEP_SUMMARY"
